# Uploads the site to HostM over explicit FTPS (port 21) after each push to main.
# If the FTP secrets are not set yet, the job succeeds and skips the upload.

name: Deploy to HostM

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-tylilo
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy site over FTPS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check FTP secrets
        id: ftp
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          set -euo pipefail
          if [ -z "${FTP_SERVER}" ] || [ -z "${FTP_USERNAME}" ] || [ -z "${FTP_PASSWORD}" ]; then
            echo "FTP secrets are not all set yet (FTP_SERVER, FTP_USERNAME, FTP_PASSWORD)."
            echo "Skipping deploy. Nothing was uploaded."
            echo "Add the secrets under Settings, Secrets and variables, Actions, then run this workflow again."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          dir="${FTP_SERVER_DIR:-public_html/}"
          case "$dir" in
            *..*)
              echo "FTP_SERVER_DIR must not contain .."
              exit 1
              ;;
          esac
          dir="${dir#/}"
          case "$dir" in
            */) ;;
            *) dir="${dir}/" ;;
          esac
          if ! printf '%s' "$dir" | grep -Eq '^[A-Za-z0-9._/-]+/$'; then
            echo "FTP_SERVER_DIR may only contain letters, numbers, dots, underscores, hyphens, and slashes."
            exit 1
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "dir=${dir}" >> "$GITHUB_OUTPUT"
          echo "FTP secrets found. Deploying into ${dir}"

      - name: Upload the Turnstile secret
        if: steps.ftp.outputs.ready == 'true'
        env:
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ steps.ftp.outputs.dir }}
        run: |
          set -euo pipefail
          if [ -z "${TURNSTILE_SECRET}" ]; then
            echo "TURNSTILE_SECRET is not set."
            echo "The contact form will reject messages until that repository secret exists."
            echo "The secret value was not printed."
            exit 0
          fi
          umask 077
          work=$(mktemp -d)
          php -r 'file_put_contents($argv[1], "<?php\n\ndeclare(strict_types=1);\n\nreturn ".var_export(getenv("TURNSTILE_SECRET"), true).";\n");' "$work/turnstile.php"
          upload() {
            local dest="$1"
            curl --silent --show-error --ftp-ssl --ssl-reqd --ftp-pasv --ftp-create-dirs \
              --user "${FTP_USERNAME}:${FTP_PASSWORD}" \
              -T "$work/turnstile.php" \
              "ftp://${FTP_SERVER}/${dest}"
          }
          # FTP_SERVER_DIR is the web root, usually public_html/. The login
          # directory itself may be that web root, or its parent. Write the
          # secret in every place PHP looks, and do not stop after the first
          # success: a path curl can write may still be outside open_basedir.
          web="${FTP_SERVER_DIR%/}"
          parent=$(dirname "$web")
          if [ "$parent" = "." ] || [ "$parent" = "/" ]; then
            sibling="tylilo-data/turnstile.php"
          else
            sibling="${parent}/tylilo-data/turnstile.php"
          fi
          dests=(
            "$sibling"
            "${FTP_SERVER_DIR}tylilo-data/turnstile.php"
            "${FTP_SERVER_DIR}data/turnstile.php"
          )
          stored=0
          for dest in "${dests[@]}"; do
            if upload "$dest"; then
              echo "Stored the Turnstile secret at ${dest}."
              stored=$((stored + 1))
            else
              echo "Could not store the Turnstile secret at ${dest}."
            fi
          done
          if [ "$stored" -eq 0 ]; then
            echo "The Turnstile secret was not stored. The contact form will keep rejecting messages."
            exit 1
          fi
          rm -rf "$work"
          echo "The secret value was not printed."

      - name: Upload the admin setup code
        if: steps.ftp.outputs.ready == 'true'
        env:
          ADMIN_SETUP_CODE: ${{ secrets.ADMIN_SETUP_CODE }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ steps.ftp.outputs.dir }}
        run: |
          set -euo pipefail
          if [ -z "${ADMIN_SETUP_CODE}" ]; then
            echo "ADMIN_SETUP_CODE is not set."
            echo "The first admin cannot be created until that repository secret exists."
            echo "The code was not printed."
            exit 0
          fi
          umask 077
          work=$(mktemp -d)
          php -r 'file_put_contents($argv[1], "<?php\n\ndeclare(strict_types=1);\n\nreturn ".var_export(getenv("ADMIN_SETUP_CODE"), true).";\n");' "$work/admin-setup.php"
          upload() {
            local dest="$1"
            curl --silent --show-error --ftp-ssl --ssl-reqd --ftp-pasv --ftp-create-dirs \
              --user "${FTP_USERNAME}:${FTP_PASSWORD}" \
              -T "$work/admin-setup.php" \
              "ftp://${FTP_SERVER}/${dest}"
          }
          if upload "tylilo-data/admin-setup.php"; then
            echo "Stored the admin setup code outside the web root."
          else
            echo "Could not store the setup code beside the site. Trying the blocked data directory."
            upload "${FTP_SERVER_DIR}data/admin-setup.php"
            echo "Stored the admin setup code in the blocked data directory."
          fi
          rm -rf "$work"
          echo "The setup code was not printed."

      - name: Deploy to HostM
        if: steps.ftp.outputs.ready == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          # HostM certificates often do not match the FTP hostname.
          # The connection is still encrypted. Set this to strict if the
          # certificate matches the name in FTP_SERVER.
          security: loose
          server-dir: ${{ steps.ftp.outputs.dir }}
          log-level: standard
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/README
            **/README.md
            **/*.md
            **/.gitignore
            **/.gitattributes
            **/.DS_Store
            **/Thumbs.db
            **/.ftp-deploy-sync-state.json
            **/.env
            **/.env.*
            **/node_modules/**
            **/router.php
            **/scripts/**
            **/scripts/**/**
            **/data/**
            **/admin.sqlite
            **/admin.json
            **/admin-ip.salt
            **/admin-setup.php
            **/tests/**
