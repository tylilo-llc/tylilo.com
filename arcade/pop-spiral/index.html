<style>
  html,body{margin:0;height:100%;background:#050912;overflow:hidden;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#eaf6ff;
    user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
  canvas#game{position:fixed;inset:0;display:block;width:100vw;height:100vh;cursor:crosshair;touch-action:none}
  .hud-btn{position:fixed;z-index:5;width:52px;height:52px;border-radius:50%;border:1px solid rgba(160,220,255,.35);
    background:radial-gradient(circle at 35% 30%,rgba(120,190,255,.35),rgba(10,25,50,.75));color:#eaf6ff;font-size:24px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.4);padding:0}
  .hud-btn:hover{border-color:rgba(160,220,255,.8)}
  #btnGear{top:12px;right:12px;z-index:30}
  #btnSwap{bottom:18px;right:18px;width:64px;height:64px;font-size:28px}
  .overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(3,8,20,.55);z-index:10;padding:16px;box-sizing:border-box}
  .hidden{display:none!important}
  .card{background:linear-gradient(160deg,rgba(24,44,82,.95),rgba(9,16,34,.96));border:1px solid rgba(120,200,255,.3);
    border-radius:20px;padding:26px 30px;max-width:520px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.55);
    animation:pop .35s ease-out;max-height:92vh;overflow:auto;box-sizing:border-box}
  body.reduced .card{animation:none}
  @keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
  .title{font-size:clamp(40px,9vw,72px);font-weight:900;letter-spacing:1px;margin:0 0 4px;line-height:1.05;
    background:linear-gradient(90deg,#ff7ab6,#ffd36b,#6be6ff,#a98bff);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 3px 8px rgba(0,0,0,.5))}
  h2{margin:0 0 6px;font-size:30px}
  .sub{opacity:.85;margin:0 0 14px;font-size:16px}
  .ver{display:inline-block;font-size:12px;opacity:.7;border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:2px 8px;margin-bottom:12px}
  .controls{font-size:13.5px;opacity:.85;text-align:left;margin:12px auto 4px;max-width:400px;line-height:1.55}
  .controls b{color:#9fe2ff}
  .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
  button.ui{font:inherit;font-weight:700;font-size:17px;border-radius:12px;border:1px solid rgba(160,220,255,.45);padding:11px 22px;
    background:rgba(40,70,120,.6);color:#eaf6ff;cursor:pointer;min-width:120px}
  button.ui.primary{background:linear-gradient(180deg,#38c6ff,#1f7fe0);border-color:#8fe0ff;box-shadow:0 4px 16px rgba(40,160,255,.4)}
  button.ui:hover{filter:brightness(1.12)}
  .stat{font-size:18px;margin:4px 0}
  .stat b{color:#ffd36b}
  #settings{z-index:20}
  #settings .card{max-width:560px;text-align:left;padding:18px 26px}
  #settings h2{margin-bottom:0}
  #settings h2{text-align:center}
  .sec{margin:10px 0 4px;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:#8fd3ff;border-bottom:1px solid rgba(140,200,255,.2);padding-bottom:4px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:3px 0;font-size:15px}
  .row label{flex:1}
  .row input[type=range]{width:150px;accent-color:#38c6ff}
  .row select{font:inherit;font-size:14px;background:#0d1a33;color:#eaf6ff;border:1px solid rgba(160,220,255,.4);border-radius:8px;padding:5px 8px}
  .switch{position:relative;width:46px;height:26px;flex:none}
  .switch input{opacity:0;width:100%;height:100%;margin:0;position:absolute;inset:0;cursor:pointer;z-index:1}
  .switch span{position:absolute;inset:0;border-radius:13px;background:#33435f;transition:background .15s}
  .switch span::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}
  .switch input:checked+span{background:#2aa8ee}
  .switch input:checked+span::after{transform:translateX(20px)}
  .switch input:disabled+span{opacity:.4}
  .note{font-size:12px;opacity:.65}
  #palettePreview{display:flex;gap:8px;justify-content:center;padding:8px 0 2px}
  .foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:10px;flex-wrap:wrap}

  .copyright{font-size:11px;opacity:.55;margin:12px 0 0;letter-spacing:.2px}
  #settings .copyright{margin:8px 0 0;text-align:center}
  #whatsNew{z-index:25}
  #whatsNew .card{max-width:560px;text-align:left;padding:18px 26px 16px;display:flex;flex-direction:column;max-height:92vh;overflow:hidden}
  #whatsNew h2{text-align:center;margin-bottom:8px;flex:none}
  .whatsnew-body{overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;text-align:left;flex:1;min-height:0;max-height:calc(92vh - 170px);padding:4px 2px 12px;font-size:14px;line-height:1.5}
  .whatsnew-ver{margin:0 0 16px;padding-bottom:12px;border-bottom:1px solid rgba(140,200,255,.2)}
  .whatsnew-ver:last-child{border-bottom:none;margin-bottom:0}
  .whatsnew-ver h3{margin:0 0 6px;font-size:18px;color:#ffd36b}
  .whatsnew-date{font-weight:600;font-size:13px;opacity:.7;margin-left:8px;color:#eaf6ff}
  .whatsnew-ver h4{margin:10px 0 4px;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:#8fd3ff}
  .whatsnew-body ul{margin:0 0 6px;padding-left:1.15em}
  .whatsnew-body li{margin:0 0 4px}
  .whatsnew-body code{font-size:.92em;background:rgba(120,200,255,.12);padding:0 4px;border-radius:4px}
  #whatsNew .btns{flex:none;margin-top:12px}
</style>
</head>
<body>
<canvas id="game" aria-label="Pop Spiral game canvas"></canvas>
<button id="btnGear" class="hud-btn" aria-label="Settings / pause" title="Settings (Esc)">&#9881;</button>
<button id="btnSwap" class="hud-btn hidden" aria-label="Swap orbs" title="Swap (Space / right-click)">&#8646;</button>
<div id="overlay" class="overlay"><div class="card" id="overlayCard"></div></div>
<div id="settings" class="overlay hidden">
  <div class="card" role="dialog" aria-label="Settings">
    <h2 id="settingsTitle">Settings</h2>
    <div class="sec">Sound</div>
    <div class="row"><label for="sfx">Sound effects</label><span class="switch"><input type="checkbox" id="sfx"><span></span></span></div>
    <div class="row"><label for="sfxVol">SFX volume</label><input type="range" id="sfxVol" min="0" max="1" step="0.05"></div>
