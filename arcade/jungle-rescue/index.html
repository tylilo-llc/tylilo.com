  JUNGLE RESCUE - CHANGELOG

  v2.18
  - Leaderboards are split by difficulty. Points go to easy, normal or expert;
    a full-campaign clear time goes to easy-time, normal-time or expert-time
    (lower wins). The difficulty is the one the run started on. Every submit
    still sends version and the stage reached as level. op:start uses the same
    board the submit will use; each board has its own token.
  - The Top 10 menu shows the boards for one difficulty at a time (it opens on
    the current setting; left/right or a tap switches). The save prompt names
    the difficulty.
  - Old kept saves in jungleRescueLbQueue are sent to the stored difficulty's
    board, or to easy / easy-time if no difficulty was stored. They are never
    sent to the old default or time boards.
  - A run that used a helping cheat code (BOOGER MODE) at any point, or the
    debug invincibility flag, is never submitted or queued. The game-over,
    victory and credits screens say CHEAT RUNS AREN'T SAVED TO THE LEADERBOARD.
    Quitting from pause does not offer a save. Cosmetic codes (TYLER, KEN) and
    CLEAR do not count. If a cheat run somehow reaches a submit, the payload
    includes cheat: true (the field is left off when the run is clean) so the
    server can reject it; a 400 for that is dropped, not queued or retried.
  - No new localStorage keys.

  v2.17
  - Leaderboard submits now send the game version (the VERSION string) and the
    stage the run ended on or reached (a whole number from 1 to 20, as `level`).
    Both boards send them. A full-campaign clear (the time board) sends 20.
    Stage-select runs send the stage they ended on. Kept saves store both in
    jungleRescueLbQueue and send them on a resend. An older queued save with
    no version or level still goes out: version is the current VERSION, and
    level is omitted if it was never stored (the API treats both as optional).
    No new localStorage keys.

  v2.16
  - Shared UDLR launch splash (UDLR Master's udlr-splash.js, inlined unchanged in
    the udlr-splash script block at the start of the body by tools/inline_splash.py).
    It plays on every launch, before the title. Until it finishes or is skipped
    nothing runs: no update/draw, no music or sound, no menu input, no leaderboard
    request (the Top 10 load and kept-save retry start from onDone).
  - The key / click / tap / gamepad button that skips the splash only unlocks audio;
    it never reaches the title menu (keys, taps and pad state are cleared at onDone,
    a held pad button must be released first). F (fullscreen) is ignored under it.
  - On a phone held upright the splash plays first, then the rotate screen.

  v2.15
  - Leaderboard fix (a score of 187,100 never reached the board, 2026-11-21).
    Main cause: op:start was tried once per run with a 5 s timeout; if it failed
    the run had no token and lbMakeOffer returned null, so game over, victory and
    the ending skipped the save prompt with no message. Now:
    * a failed op:start is retried in the background (5 s, 15 s, 30 s, then every
      60 s) while the board belongs to the current run, once more at game over /
      victory / the ending, for both boards and for the fresh token after a
      save-then-CONTINUE;
    * a qualifying run always gets the prompt; with no token yet it says
      COULDN'T REACH THE LEADERBOARD and the button reads TRY AGAIN (asks for a
      token, then submits);
    * playedMs stays clamped to the token's real age; a token younger than the
      minimum play time (20 s) is waited out with a visible SAVING... n;
    * a submit that fails for a network reason is retried once with the same
      token, then kept (below);
    * note-only results (cheat runs, runs under 20 s) are now shown on the
      victory and credits screens too, not just game over.
  - Second cause found while tracing: the save prompt kept SKIP selected even when the name box was already filled
    from the last save, so a returning player's usual Enter / gamepad A skipped the
    score silently. With a remembered name the prompt now opens on SAVE SCORE
    (first-time players still start on SKIP; SKIP, ESC, BACK and II still skip).
  - MAIN MENU or BACK TO ARCADE from pause during a run of 20 s or more now opens
    the save prompt first (v2.14 dropped that score).
  - HTTP 429 (5 saves per network per 10 minutes, shared by all Arcade games),
    network failures and 5xx no longer lose the save: it is kept in memory and in
    localStorage jungleRescueLbQueue and re-sent by itself (every 2 min after a 429,
    every minute otherwise, and on page load / coming back online) until it is
    accepted, rejected with a 400, or its token passes 6 h.

  v2.14
  - Shared Tylilo Arcade leaderboard (slug jungle-rescue), same-origin
    /api/scores.php. Only active on https://tylilo.com or https://www.tylilo.com;
    everywhere else (file://, localhost, other hosts, http) the game makes no
    requests and shows no leaderboard UI. 5 s timeout (AbortController) on every
    request; errors and timeouts fail silently and never block play.
  - Boards: 'default' = final score (0-5,000,000) at game over, victory or the
    ending; 'time' = full-campaign clear time in whole seconds (1-7200, lower wins),
    only for runs started at stage 1 that beat the game. CONTINUE keeps the same
    run (it replays the stage, no stages are skipped) and the clock keeps running;
    runs started from a later stage in LEVEL SELECT never get a time token.
  - op:start for 'default' when a run begins (START / LEVEL SELECT), and for
    'time' only when it begins at stage 1. Play time is real time while a run is
    playing (intro, play, stage clear, ending); pause, menus, the rotate screen and
    hidden tabs don't count. A score saved at game over gets a fresh token if the
    player then continues.
  - Runs of 20 s or more (or the server's minPlayedMs) get an optional ARCADE
    LEADERBOARD prompt: name (1-12 letters, digits, spaces, -), SAVE SCORE, SAVE
    TIME (when eligible) and SKIP, which is selected by default. Inputs are ignored
    for the first 0.7 s so mashing at the end of a run can't act on it. Keyboard
    types directly (Enter saves once you've typed); gamepad uses an on-screen letter
    grid (A pick, B delete, BACK skip); touch / mouse tap the grid or the name box,
    which opens a real text input for the native keyboard. Server rejections show
    the server's message, HTTP 429 shows TRY AGAIN LATER, success shows the rank.
    Runs with BOOGER MODE (invincibility code) used stay off the leaderboard.
  - LEADERBOARD item on the title menu (above WHAT'S NEW) with the Top 10 for both
    boards; it only appears after the board has loaded on tylilo.com.
  - New localStorage key jungleRescueName: the last name used on the leaderboard.

  v2.13
  - BACK TO ARCADE: new last item on the title menu and on the pause menu.

    relative URL, never a new window). From the title it leaves directly;
    from the pause menu (a run in progress) it first asks 'LEAVE RUN?' with
    NO selected, and YES saves the high score and the stage's best distance

  - Accessibility: a visually hidden 'Back to Arcade' button (same rules:

  - Landscape only on phones and tablets: a touch device (coarse pointer)

    game is frozen - a run in play is paused first and nothing updates or
    counts time underneath; turning to landscape hides it and leaves the run

    pointer), however narrow, never get it. Tablets in portrait get it too:
    the old portrait layout only gave the game a letterboxed strip above the

    rotate screen is up (it is kept only as a fallback for fine-pointer

  v2.12
  - Icons: an embedded favicon (32x32 PNG) and apple-touch-icon (180x180
    PNG), both rendered from the game's own drawing code (the commando from

  - WHAT'S NEW: new last item on the title menu and on the pause menu. It

  - Pinch zoom is no longer locked: the viewport meta drops maximum-scale /

  v2.11
  - Soldiers no longer get stuck at pit edges. Why they did: chargers and
    flame troopers rolled a 50% coin per surface to jump at an edge with a
    fixed hop (often too short or into the pit), otherwise walked off and
    fell; any wall made them hop on the spot forever; v2.9 cautious/hold
    soldiers simply froze at every edge (and ledge) wanting to advance.
  - New edge navigation for every moving soldier (charger, cautious, flame
    trooper, patrol, guards walking in): at a pit / water gap / ledge it
    simulates the real physics - walks on, drops to lower solid ground, or
    picks a jump arc that is checked to land on solid, dry ground (never
    water, a collapsing bridge or a lip). Small steps up are hopped. If the
    gap is too wide it stops at the edge: chargers become stationary
    shooters, flame troopers wait there (and turn back if you get behind
    them), cautious soldiers hold; patrols turn around or now and then jump
    a short gap. Jumps use the jump pose and commit to their arc.
  - Safety net: a soldier that still falls (e.g. pushed) is removed cleanly
    as soon as it drops out of the screen.
  - Barrel roll knock-down: rolling into a soldier (regular, flame trooper or
    a landed paratrooper) knocks it down like a stomp (~2 s, harmless, can
    be shot or stomped); the roll continues through and that soldier can't
    hurt you. A knocked-down flame trooper doesn't explode.
  - Python fix: the snake stays anchored in its tree. It hangs only a short
    way below the branch (max ~52 px) and lunges at most ~22 px; it can only
    grab you when your body is within ~14 px of its head - i.e. up high
    (jumping at it, or on a ledge / platform under a low branch). Running
    along the ground under a normal branch is safe. Tell + shooting kept.
    The chopper rope stays safe (rope riders are invulnerable by design).
  - Frogs are now ordinary harmless green / brown frogs: no poison, no
    damage, bullets pass them by, they hop out of your way. Only snakes and
    spiders poison (and cause the double-poison stagger).
  - Soldier melee: the olive-green regulars punch and kick when you are
    close (wind-up tell with a flashing '!', short cooldown); ~17% wear a
    red beret and carry a knife (quicker slash, longer reach). Your melee or
    any hit interrupts the wind-up. Booger mode makes you immune.
  - Melee stagger system (replaces the instant-kill melee): every punch /
    kick (yours on soldiers, theirs on you; flying kicks, sweeps and rope
    kicks too) staggers the target ~0.5 s (knock-back, stars, can't attack).
    Each target secretly rolls hits-to-kill when the fight starts: 1-3, or
    2-5 with body armor (your armor pickup or an armored soldier). Yours
    resets when you lose a life. Stomps / rolls still just knock down.
    Your armor no longer absorbs melee - it raises the count instead.
  - Armored soldiers (vest overlay): none in stages 1-3, ramping to ~28% by
    stage 20 (x0.75 Easy, x1.2 Expert). The vest soaks 2 bullets with a
    spark + ping, then visibly breaks off (3rd bullet kills); laser and
    fireball strip it in one hit (2 hits). Knife soldiers can be armored.
  - Knives vs armor: an armored soldier (or you wearing armor, slashed by a
    knife soldier) takes a random 1-2 knife hits; a non-lethal one staggers.
    A knife charge is only used up on the killing hit.
  - Grenades: flying capsules now include a GRENADE pickup (G). It gives
    grenades equal to the stage number (max 5 per pickup), carried up to 9
    and kept when you lose a life. Throw: G, middle mouse button, gamepad
    R3 (right-stick click) or the touch GRENADE button (shown only when you
    have some). Arc, one bounce, ~1 s fuse, 44 px blast: instantly kills
    every non-boss NPC (armored, knife, flame troopers - no knock-back onto
    you - paratroopers, snakes, spiders, gators, pythons); frogs scatter;
    bosses take solid damage. Never hurts you. HUD shows the count.
  - Trading cards (main menu -> CARDS): BOSSES (20) unlock when you beat
    that stage's boss on any difficulty (first-defeat difficulty and best
    fight time saved); FIELD GUIDE (16 NPC / creature types) unlock the
    first time each appears on screen near you, with a NEW CARD toast.
    Locked cards are face-down '?'. Unlocked cards open as a large tiered
    trading card: in-engine portrait, stats, flavor, signature / behavior
    and a tip. Keyboard, mouse, touch (tap / swipe) and gamepad. Options ->
    RESET PROGRESS (press twice) clears stage unlocks, beaten badges and
    cards (scores and options are kept).

  v2.9
  - Enemy variety: soldiers no longer all charge. About 45% hold a position
    (standing guard on the ground or a ledge, facing you, shooting when they
    can see you); others advance cautiously and stop at range, or patrol back
    and forth; only a minority charge (a few more on Expert). Paratroopers

  - Flame troopers never appear in stages 1-3 (paratroopers included). From

  - Stages 1-9: no enemy spawns or walks in from behind (left, off-screen),

  - KEN MODE: her rear is noticeably smaller - about half the old cartoon

  v2.8 - optimization pass (no gameplay or visual changes)
  - Rendering: static scenery is drawn once into offscreen canvases and blitted
    (tree trunks / canopies / vines, platforms, ground bodies, grass tufts,
    sky bands, sun / moon). Standard human poses (player, soldiers, corpses)
    are cached per palette / pose / aim / frame. Text uses a per-colour glyph
    atlas plus a small cache of strings that stay on screen. 1-px lines merge
    runs of pixels into single fills; scanlines are one batched fill.
    Every cached path is pixel-identical to the old one (verified frame by
    frame) and falls back to direct drawing under transparency or scaling.
  - Frame time on desktop dropped from ~1.0 ms to ~0.35 ms on average, and the
    ~6-7 ms spikes every 8-10 frames are gone (p95 ~0.5 ms); a heavily
    throttled phone simulation runs ~70% faster.
  - Update loop: hot array loops no longer allocate iterators (~20% less
    garbage per frame).
  - Memory: baked scenery only lives for the current stage and text caches
    are capped, so memory stays flat over long sessions.
  - Robustness / battery: audio clock pauses while the tab is hidden and the
    game no longer fast-forwards when you come back; saved options are
    sanity-checked on load. Small dead-code cleanup.

  v2.7
  - KEN MODE: the parachute canopy (stage intros, the stage 1 cargo-plane
    cinematic, cut / folding chutes) shows the Puerto Rican flag - five red /
    white stripes (red top and bottom), blue triangle at the hoist with a white
    five-point star. Her default outfit uses the flag colors: red shirt, blue

  - NEW: very rare constrictor ambush. Where there are trees, a big python can
    drop out of the canopy: rustling leaves and hanging coils first, then it

    If it grabs you, MASH LEFT / RIGHT (A/D, arrows, stick/d-pad, touch stick)
    to fill the ESCAPE meter before the SQUEEZE meter fills. Escape = brief
    invulnerability (with a knife the snake dies); failure costs a life (booger
    mode protects). Knives (uses one) and steroids make escaping much easier
    and stack; snake-bite poison makes it much harder; body armor gives much
    more time. Never at bosses, during the parachute, rope rides, or right
    after a respawn. Rarer on Easy, a little more common on Expert.
  - NEW: poison dart frogs (blue / yellow / red) sometimes climb tree trunks
    and hop or crawl around them (uncommon, never in boss arenas). Touching one
    - bumping, landing on it, punching or kicking it - poisons you exactly like
    a snake bite (slower running, blurred vision, 20 s; also counts for the
    constrictor). Shooting them is safe. A knife kills one on contact without
    poison; on steroids touching one squashes it with no poison, and steroids
    cure frog poison just like snake poison. Armor doesn't stop it (snake rule).
  - NEW: venomous spiders on tree trunks and on webs strung by the canopy; web
    spiders lower themselves on a silk thread. Same rules as the dart frogs:
    touch = snake-bite poison, shooting is safe, knife / steroids kill on
    contact, steroids cure it. Uncommon, never in boss arenas.
  - NEW: double poisoning is lethal. Getting bitten / poisoned again by a snake,
    spider or dart frog while still poisoned makes you stagger (~1.7 s, controls
    locked, heavy blur) and then you lose a life. Steroids cure the first
    poison, so a hit after the cure is a normal single poisoning. Knives and
    steroids still kill critters on contact. Booger mode prevents it.
  - NEW: paratroopers. Now and then a soldier (sometimes a flame trooper)
    drops in ahead of you on an olive-drab chute. While descending they can't
    shoot, flame or hurt you on contact; shoot them in the air (normal health)
    or shoot the canopy to make them drop faster. They only land on solid
    ground (never a pit or water) - with nowhere safe they drift off-screen.
    On landing they ditch the chute and fight normally. Never at bosses, during
    the stage-start parachute or the rope ride. More frequent on harder levels.

  v2.5
  - NEW: barrel roll move. Shift or R (keyboard), LT (gamepad) or the purple
    ROLL button (touch) rolls you ~36 px forward on the ground with 0.3 s of
    invulnerability to dodge bullets. Can't shoot mid-roll, short cooldown,
    never rolls into a pit or hazard. Poison / steroids change the distance.
  - NEW: stomps. Landing on a soldier, flame trooper or ledge sniper from above

  - NEW: landing on a snake squashes it (+250 total), no bite.
  - NEW: stage 1 opening cinematic - cargo plane over the jungle, the commando

  v2.4
  - NEW: alligators lurk in rivers (random number and positions every run, never
    in boss arenas). They patrol, surface and snap when you wade close. Gunfire
    and melee kill them (2/3/4 hits on Easy/Normal/Expert at stage 10), +400.
    Contact rules: 1st touch while holding a knife uses a knife and shoves you
    and the gator apart (no kill); a 2nd touch with a knife kills it; touching
    one with no knife is fatal even with armor. Booger mode protects.
    Respawn points and chopper drops avoid alligators.
  - FIX: no more soft-lock behind destroyed bridges / unjumpable gaps - if you
    die before a gap you cannot cross, you respawn on safe ground past it.
  - CHANGE: Spread (S), Machine gun (M) and Fireball (F) last 45 seconds per
    pickup, then revert to the default gun. Any new pickup restarts the timer.
    HUD countdown by the weapon icon (blinks in the last 5 s) and a
    'WEAPON EXPIRED' notice. Timer pauses with the game and carries over
    between stages; losing a life still resets the gun. Laser/Rapid/Barrier
    unchanged.
  - CHANGE: Rapid fire (R) now has a HEAT bar (HUD, only while R is held). Every
    shot adds heat; it cools fast when you release fire and slowly while held.
    Holding fire non-stop overheats in about 7 s ('OVERHEATED!', sizzle, steam)
    and rapid fire is lost; bursts/tapping can be kept up forever. Bar goes
    green > yellow > red and blinks near max. Steroids' faster fire heats 10%
    faster. Works with every gun.
  - NEW: rope kick - while hanging from the rescue chopper's rope press KICK
    (right-click / touch KICK) for a swinging hanging kick that hits soldiers,
    snipers, capsules, chests, snakes and alligators within reach (normal
    melee rules and score). You stay on the rope and invulnerable. Just bumping
    into an NPC on the rope only shoves it back (brief stagger) - no kill, no
    knife used; shoves never push anyone through walls.
  - CHANGE: soldiers, snipers and turrets only shoot with line of sight - a ray
    from their muzzle to your head or chest must clear solid terrain and
    ledges (same rules as bullets), so cover works. They keep aiming/turning.
    Camouflage still lowers their fire rate. Bosses and arena minions unchanged.
  - NEW: FLAMETHROWER troopers (~6.5% of regular soldiers, never in boss fights):
    red uniform + fuel tank, telegraphed short flame cone (line-of-sight rule,
    flames stop at terrain). 2 hits of any kind to kill (+500). They explode on
    death: the blast knocks you back but never hurts you (no armor/knife used,
    never pushed over a pit edge or into a hazard) and chain-damages nearby
    enemies (+200 each).
  - NEW: PARACHUTE entry - every stage (new game, level select, next stage,
    Continue) starts with the hero drifting down under a parachute: gentle sway,
    slight left/right steering, no shooting, DOWN sinks faster. JUMP cuts the
    chute away: free fall, then a combat barrel roll on landing (clamped so it
    never rolls into a pit or hazard). Nothing spawns, moves, shoots or bites
    until he has landed (and finished the roll); a ridden chute folds away.
    Mid-stage respawns are unchanged.
  - How to Play: enemies section (line of sight, flame troopers), rope kick.
  - CHANGE: LASER (L) is now an instant beam to the screen edge in the aimed
    direction (8-way). It pierces every enemy on its path, stops at solid
    terrain with a spark, and damages each target on a tick (1 dmg / 7 frames,
    5 with rapid; bosses take 75% since the beam never misses). Bosses, boss parts

    shields, Colossus skirt, ...). The laser shares the HEAT bar with rapid fire;
    overheating loses the laser (back to the default gun) and rapid fire.
  - How to Play: alligator hazard notes and weapon timer info.

          (gunfire barely scratches him, bounces in rage: lure him onto spike traps, drop cave rocks, blow barrels),
          20 GENERAL RAVAGE (3 phases: rifle/grenades/drones/turrets -> fortress flame vents, electric floors, missile
          launchers -> powered machete + reactor-fed energy shield; destroy the reactor through its shutters, then
          survive his berserk final assault). Arena supply capsules bring the weapons each fight favours.
          Ending: fortress collapse + helicopter extraction at dawn, CAMPAIGN COMPLETE stats (score, time, hostages,
          lives lost, continues, codes), difficulty beaten badge, unlock note, scrolling credits; title shows badges.
          Machete eased (hp 48->40, no contact damage while recovering from a lunge, longer log stun, faster barrels,
          rarer phase-2 blade reflect). Valid codes now close the code window with a short toast on the menu.
  v2.2  - CAMPAIGN BATCH 3: stages 11-15 playable, campaign-end screen after stage 15.
          New themes: night canopy (giant trunks, rope bridges), scrapyard dawn (junk piles, crane), fortified camp
          at dusk (walls, watchtowers, searchlights), orchid grove (giant flowers, drifting spores), blade valley
          (bamboo, falling leaves). Difficulty ramp continues (1.98 -> 2.30).
        - Bosses 11-15 (all multi-phase, signature mechanic required):
          11 THE CANOPY KING: perches/swings between 3 trees, explosive arrows, whistles in panthers; 85% damage
            reduction while aloft - shoot his branch or swing rope to drop him (stunned, 125% damage).
          12 THE STEEL GORILLA: punches, cannon shells, traveling slam shockwaves; vents open only after a ground
            slam (upper body full damage, lower 35%, closed armor 8%). Phase 2: leaps, shorter vent window.
          13 GENERAL BLACKTHORN: 3 tactics by HP - DEFENSIVE (deployable shields block bullets, frag lobs, mines),
            AGGRESSIVE (rush + knife lunges), EVASIVE (dodge-rolls, ledge hops, sniping). Shoot mines to detonate.
          14 THE BLOOD ORCHID: 4 underground roots shield her (12% damage -> 100% as roots die; shoot them low/
            prone/kick); falling pods with shadow telegraph burst into expanding poison clouds; regrows a root.
          15 WARLORD MACHETE: parries frontal attacks (phase 2 reflects); hit him from behind, from above, with
            explosive barrels (2x) or the hanging log trap (stun); combos, blade throws, lunges, smoke teleport.
        - RESCUE CHOPPER (all stages): appears at random at most once per stage (never at a boss), hovers 10-20 s
          with a swaying rope, rotor sound. Jump into the rope end: carried 30 m (distance HUD counts it) or to
          just before the boss arena, then dropped on safe ground (respawn safety rules; release point moves to
          the nearest safe spot if the 30 m mark is a pit/water/hazard/enemy). Invulnerable while hanging and
          falling; no shooting while hanging.
        - NEW MAIN MENU: logo, version and a vertical menu (START, LEVEL SELECT, DIFFICULTY, HOW TO PLAY, OPTIONS, CODES,
          ABOUT). HOW TO PLAY sub-pages: CONTROLS (keyboard+mouse / gamepad / touch tabs, device default),
          WEAPONS & POWER-UPS, CHESTS & UPGRADES, HAZARDS (snakes, poison, stage hazards, chopper), CAMPAIGN.
          Keyboard, mouse, touch and gamepad (BACK button) navigation everywhere. Old auto-cycling pages removed.
        - OPTIONS (main menu and pause menu): MUSIC on/off, SOUND EFFECTS on/off (M stays the master mute),
          BRIGHTNESS / CONTRAST / SATURATION sliders 50-150%, SCREEN SIZE (AUTO, FIT, PIXEL PERFECT, 90/80/70%),
          SCANLINES (CRT) and SCREEN SHAKE toggles, RESET TO DEFAULTS, BACK. Keyboard/gamepad left-right, mouse
          click/drag and touch drag; applied instantly and saved. Display filters are combined with the poison blur.
        - TUNING: boss HP Canopy King 66->58, Blackthorn 76->62, Machete 70->48; Blackthorn waits longer before
          redeploying shields; Machete throws slower blades, keeps his back open longer and alternates lunges/throws.
        - CODES: 'clear' switches every active code off at once. BOOGER MODE now turns itself off when you die.
        - FIX: Captain Viper sank into the floor while taking cover (crouch was faked by drawing the whole 2x
          sprite 14 px lower, legs below ground); now a real kneeling pose. He also teleported in from off-screen
          on arena entry; now walks in. River Tyrant's shore bite sat 2 px inside the bank.
        - FIX: Steel Gorilla cannon telegraph could crash rendering on its first frame.
        - FIX (phones): tapping CODES could immediately close it again (the tap's ghost click hit BACK).
        - SAFETY NET: every boss is clamped to its arena floor and bounds each frame (logged if it ever fires).
  v2.1  - CAMPAIGN BATCH 2: stages 6-10 playable (11-20 COMING SOON), campaign-end screen after stage 10.
          New stage themes: web-choked marsh, burning outpost (embers, smoke columns), stormy electric river
          (lightning), toxic jungle lab, mercenary canopy camp. Difficulty keeps ramping (1.58 -> 1.9).
        - Stage hazards: sticky web patches (slow), burning debris (jump it), electrified river zones that
          pulse on/off with warning lights, toxic puddles/water (poison).
        - Bosses 6-10, each with 2 phases and a signature mechanic:
          6 THE SWAMP WIDOW: web globs stick you (tap jump to break free) and leave slowing webs, venom spit,
            ambushes from the pool, ceiling drops; 3 web nests spawn spiders - ANY shot sets a nest alight
            (2 hits, 1 with fire) and a burnt nest spawns no more (she rebuilds one nest once in phase 2).
          7 COLONEL EMBER: incendiary grenades leave burning ground, flare volleys, flamethrower, napalm;
            the arena burns inward from both walls (min 150 px safe zone, 108 px in phase 2; ledges stay safe).
          8 THE RIVER TYRANT: armored electric croc ambushes from the water (bubble telegraph), sinks rafts,
            spits electric orbs; 2 generators electrify the water (lethal) - shoot them off before wading;
            while powered the croc is shielded (10% damage); in phase 2 he reboots a generator (shoot it).
          9 DOCTOR VENOM: poison darts (first dart poisons, a second while poisoned hurts), gas grenades,
            vents fill the lab with toxic gas (poison + choking), releases mutants; 3 air filters (shoot)
            seal their vents and suck the gas away - Venom heals while standing in his gas. Phase 2: mutates.
          10 THE TWIN HUNTERS: sniper (long laser telegraph, locks before firing) + rapid-fire gunner take
            turns covering each other; dual health bars; defeating one enrages the other.
        - Generic boss phase announcements.
        - DIFFICULTY (title menu, saved): EASY / NORMAL / EXPERT. NORMAL = the original tuning exactly.
          Per-stage multiplier still ramps: EASY lower base + gentler ramp (0.72 -> 1.26 over stages 1-10),
          EXPERT higher base + steeper ramp (1.25 -> 2.47); affects enemy HP, fire rate, spawn density, boss
          HP/attack speed, enemy bullet speed (x0.85 / x1 / x1.15), starting & continue lives (5 / 3 / 2),
          chests (x1.6 / x1 / x0.6) and weapon capsules (+3 / 6 / -2). Shown in HUD and pause. Unlocks shared.
        - CODES (title menu): real text input (phone keyboards), case-insensitive, trimmed; CODES table for
          future additions. 'booger' = BOOGER MODE toggle: immune to everything except pits and bosses
          (boss attacks/projectiles/contact/minions/arena hazards still hurt). 'tyler' = BALD MODE toggle
          (cosmetic: shiny bald head instead of the red headband). Codes last until toggled off or reload.
        - FIX: safe respawn - after death / continue / grapple rescue the player always lands on solid,
          hazard-free ground (no pits, rivers, bridges, rafts, fire/zap/toxic/web/gas, enemies, snakes or
          boss attack areas): nearest safe spot at or behind the death point on screen, else nearest anywhere.
        - FIX: procedural stages could end with an unjumpable gap right before the boss arena (stage 8).
  v2.0  - CAMPAIGN: 20-stage framework (LEVELS table), stages 1-5 playable, 6-20 listed as COMING SOON.
          Each stage: own scrolling layout (stage 1 hand-built, 2-5 seeded procedural: pits, steps, rivers,
          exploding bridges, ledges), palette/time of day (dusk jungle, moonlit night with stars/fireflies,
          rainy foggy swamp, overgrown temple ruins, river at dawn), enemy mix/density, chest+snake counts,
          smooth difficulty ramp (enemy fire rate, turret HP, spawn rate, boss HP) and a boss arena.
        - Intro card 'STAGE N - name / BOSS', WARNING card with boss name, boss health bar with name.
          Stage clear tally (score, distance, hostages) then the next stage; weapon, upgrades, lives and
          score carry over. Distance HUD per stage (metres to that stage's boss).
        - Game over -> CONTINUE (restart the stage with 3 lives, score reset to the stage-start score) or
          MAIN MENU. Highest unlocked stage saved; title menu START / LEVEL SELECT (unlocked stages only).
        - Bosses 1-5 (procedural sprites, telegraphed attacks, phase 2 under 50% HP):
          1 CAPTAIN VIPER (replaces the base wall): rifle bursts, grenade lobs, machete up close, moves
            between sandbag cover; 2 radio towers call patrols until destroyed.
          2 THE ARMORED BOAR: telegraphed charges, knocks down trees (falling-tree hazard), crashes into the
            arena wall and is stunned - only the exposed fuel tanks take damage.
          3 SERGEANT SKULLMASK: shotgun, flamethrower, smoke bombs that hide him; stereo-panned footsteps and
            weapon sounds (WebAudio) plus faint footstep dust/glints so it stays playable muted.
          4 THE VINE STALKER: climbs trees, drops from above (shadow telegraph), burrows (ground rumble);
            cutting its glowing vines removes climb routes and strips its bark armor.
          5 MAJOR IRONHIDE: machine-gun sweeps, homing rockets, stomp shockwave; front armor nearly immune
            (sparks), power pack on his back takes 1.5x damage; he turns slowly to track you.
        - New title info page about the campaign. All earlier systems kept.
  v1.6  - Distance HUD: furthest progress shown under the HI score as metres (start 0M -> enemy base 250M,
          ~16 px per metre) with a slim progress bar ending in a skull marker (bar hides while the BASE
          health bar is shown). Never decreases, kept on respawn, reset on a new run. Final distance on the
          game-over and victory screens; best distance saved (localStorage) and shown as BEST.
  v1.5  - Projectiles collide with terrain: every player shot (N/S/M/L/F) and every enemy shot (soldiers,
          snipers, turrets, boss cannons) is destroyed with a small spark puff when it hits solid ground,
          walls or the boss wall. Shots travelling downward also stop on top of one-way ledges and bridges;
          horizontal/upward shots pass through ledges (like jumping through them); water does not block.
          A shot ignores the ledge/bridge its shooter is standing on, so you (and snipers) can fire down
          from a ledge at targets below. The laser still pierces enemies but stops at the ground. Turrets
          set into terrain get a short spawn grace so they can still fire out.
  v1.4  - New chest upgrade STEROIDS (5 equally likely chest items now): +10% run speed, +10% fire rate
          (all weapons, stacks with Rapid) and a mid-air double jump for 30 s. HUD countdown (blinks in last
          5 s), red aura on the player, re-pickup resets to 30 s, lost on death.
        - Jungle SNAKES: random count/positions each run on ground and ledges; they slither back and forth
          and rear up when you get close. A bite poisons you for 20 s: run speed -10% on the ground (jump
          height/speed/distance unchanged) and mildly blurred vision. Bites never kill or use armor or
          lives; re-bite resets the timer; cured on death or by picking up STEROIDS. With KNIVES, touching
          a snake uses one knife to kill it (no bite). Shoot (low/prone or when they rear) or melee
          them for 150 pts. Poison HUD countdown; fourth title page explains snakes.
  v1.3  - Random wooden chests (4-6 per run, ground/ledges) break open (gun or melee) to reveal an upgrade:
          BODY ARMOR (absorbs 2 hits), KNIVES (+3, auto-kill an NPC on body contact), GRAPPLE HOOK
          (saves one pit fall), CAMOUFLAGE (~25% slower enemy fire/aim). All upgrades lost on death.
          Compact HUD row for upgrades; third title page explains chests/upgrades.
  v1.2  - Melee: punch (C/L, pad Y, touch C) and kick (V/;, right-click, pad RT, touch D);
          airborne kick = flying dive kick, down+kick = low sweep. One-hit KO on soldiers/snipers with
          knockback, bonus score, hit sparks, screen shake and SFX; breaks capsules, chips turrets/boss.
  v1.1  - Left mouse button fires (hold for continuous fire, like X/K); click starts/advances screens.
        - Pause menu: RESUME / MAIN MENU (with YES/NO confirm) via keys, mouse or touch; Esc/P toggle pause.
        - Version number shown on title and pause screens, in <title> and meta tag (single VERSION constant).
  v1.0  - Initial release: single-file Canvas run-and-gun, jungle stage, enemies, power-ups, boss,
          responsive layout with touch controls (portrait/landscape), keyboard + gamepad, WebAudio sound.
-->

    c.fillStyle='#2a2420';c.fillRect(280,40,4,80);c.fillRect(250,40,70,3);c.fillRect(312,43,1,30);c.fillRect(308,73,9,6);for(let i=0;i<8;i++)c.fillRect(281+(i%2?2:-1),44+i*9,1,6);}
  if(T.fort){c.fillStyle='#24202a';c.fillRect(0,100,BGW,20);for(let x=0;x<BGW;x+=10)c.fillRect(x,96,6,4);

      c.fillStyle='rgba(255,240,180,0.07)';c.beginPath();c.moveTo(tx+8,60);c.lineTo(tx-40,0);c.lineTo(tx+10,0);c.fill();}}
  if(T.grove){for(const[fx,fy,r]of[[50,84,14],[180,74,18],[320,88,12],[430,78,16]]){c.fillStyle='#1a2a1a';c.fillRect(fx-1,fy,3,124-fy);
      for(let k=0;k<6;k++){const a=k*Math.PI/3;c.fillStyle=k%2?'#4a1a3a':'#5a2048';c.beginPath();c.ellipse(fx+Math.cos(a)*r*0.6,fy+Math.sin(a)*r*0.6,r*0.55,r*0.3,a,0,6.283);c.fill();}

  if(T.peak){for(const[tx,th]of[[70,70],[230,84],[400,64]]){c.strokeStyle='#2a2e40';c.lineWidth=1;c.beginPath();c.moveTo(tx-10,118);c.lineTo(tx,118-th);c.lineTo(tx+10,118);c.stroke();for(let y=118-th+8;y<118;y+=8){c.beginPath();c.moveTo(tx-(118-y)/th*10,y);c.lineTo(tx+(118-y)/th*10,y);c.stroke();}
      c.fillStyle='#ff3030';c.fillRect(tx-1,118-th-2,2,2);}}
  if(T.wrecks){c.fillStyle='#2a221c';for(const[wx,s]of[[60,1],[300,1.3]]){c.fillRect(wx,118-30*s,40*s,30*s);c.fillRect(wx+8*s,118-52*s,24*s,22*s);c.fillRect(wx+30*s,118-46*s,30*s,5*s);c.fillRect(wx-6*s,118-20*s,10*s,20*s);c.fillRect(wx+40*s,118-14*s,12*s,14*s);}
    c.fillRect(190,108,46,10);c.fillRect(200,100,22,8);c.fillRect(218,103,24,3);}
  if(T.deadtrees){c.strokeStyle='#4a5a5a';c.lineWidth=2;for(const[tx,th]of[[40,60],[150,74],[260,56],[380,70],[470,62]]){c.beginPath();c.moveTo(tx,120);c.lineTo(tx,120-th);c.stroke();for(let k=0;k<3;k++){const y=120-th+10+k*14,d=k%2?1:-1;c.beginPath();c.moveTo(tx,y);c.lineTo(tx+d*14,y-10);c.stroke();}}c.lineWidth=1;}
  if(T.cave){c.fillStyle='#1a0e0a';for(let x=0;x<BGW;x+=16){const h=10+((x*37)%23);c.beginPath();c.moveTo(x,0);c.lineTo(x+16,0);c.lineTo(x+8,h);c.fill();}c.fillRect(0,0,BGW,4);}
  if(T.bones){c.fillStyle='#8a8070';for(const bx of[30,120,210,330,450]){c.fillRect(bx,116,10,2);c.fillRect(bx+9,115,3,4);c.fillRect(bx-2,115,3,4);c.fillRect(bx+20,114,6,5);c.fillStyle='#1a1410';c.fillRect(bx+21,115,1,1);c.fillRect(bx+24,115,1,1);c.fillStyle='#8a8070';}}
  if(T.fortress){c.fillStyle='#1c1012';c.fillRect(150,52,180,68);for(let x=150;x<330;x+=12)c.fillRect(x,46,7,6);c.fillRect(220,20,40,40);c.fillRect(214,16,52,6);c.fillStyle='#40f0ff';c.fillRect(236,30,8,14);

  for(let x=0;x<BGW;x++){const top=Math.round(124-Math.abs(Math.sin(x*TT*24))*7-Math.abs(Math.sin(x*TT*61+1))*3);
    c.fillStyle=T.tree[0];c.fillRect(x,top,1,H-top);c.fillStyle=T.tree[1];c.fillRect(x,top,1,1);}
  [[30,1,46],[110,-1,38],[190,1,52],[260,1,40],[330,-1,48],[400,1,36],[470,-1,44]].forEach(p=>{palm(p[0],128,p[1],p[2]);palm(p[0]-BGW,128,p[1],p[2]);palm(p[0]+BGW,128,p[1],p[2]);});
  if(T.webs){c.strokeStyle='rgba(210,210,225,0.35)';c.lineWidth=1;for(const[wx,wy,r]of[[70,96,18],[230,90,22],[380,100,16]]){c.beginPath();for(let k=0;k<8;k++){const a=k*Math.PI/4;c.moveTo(wx,wy);c.lineTo(wx+Math.cos(a)*r,wy+Math.sin(a)*r);}
      for(let ring=1;ring<=3;ring++){const rr=r*ring/3.3;for(let k=0;k<=8;k++){const a=k*Math.PI/4,px=wx+Math.cos(a)*rr,py=wy+Math.sin(a)*rr;if(k)c.lineTo(px,py);else c.moveTo(px,py);}}c.stroke();}}

const HELI_M=30;

function spawnHeli(atCam){G.heliPlan=null;const life=Math.round(rnd(600,1200));G.heli={x:G.camX+W+50,y:30,vx:-1.6,t:0,life,state:'in',hx:G.camX+rnd(150,240),sway:0,ride:null,rope:58};G.heliSpawns=(G.heliSpawns||0)+1;sfx('rotor');void atCam;}
function heliTop(x1,x2){let t=148;for(let $i=0,$a=SURF,s;$i<$a.length&&(s=$a[$i],true);$i++)if(s.x2>=x1&&s.x1<=x2&&s.y>30&&s.y<t)t=s.y;return t;}
function ropeEnd(h){const sw=Math.sin(h.t*0.05)*6+h.vx*-4+(h.ksw||0);return[h.x+sw,h.y+14+h.rope];}
function heliLandX(p0x){ // release x: exactly HELI_M metres ahead if that spot is safe, else the nearest safe spot further on (never past the arena entrance)
  const m0=distM(p0x),lim=ARENA_X-60,ppm=pxPerM(),mLim=distM(lim),want=Math.min(m0+HELI_M,mLim);const okX=x=>x<=lim&&x>p0x+20&&safeAt(x)!==null;
  const inM=m=>{const c=40+(m+0.5)*ppm,xs=[];for(let x=Math.floor(c-ppm)-2;x<=Math.ceil(c+ppm)+2;x++)if(distM(x)===m)xs.push(x);xs.sort((a,b)=>Math.abs(a-c)-Math.abs(b-c));for(const x of xs)if(okX(x))return x;return null;};
  for(let k=0;k<=26;k++){const m=want+(k&1?(k+1)>>1:-(k>>1));if(m<=m0||m>mLim)continue;const x=inM(m);if(x!==null)return x;}
  for(let m=want;m<=mLim;m++){const x=inM(m);if(x!==null)return x;}
  for(let m=want-1;m>m0;m--){const x=inM(m);if(x!==null)return x;}return null;}

function updateTitle(I){titleT++;camBG+=0.6;const o=titleSel,N=TMENU.length;
  if(I.downP)titleSel=(titleSel+1)%N;if(I.upP)titleSel=(titleSel+N-1)%N;
  if(titleSel===2&&(I.leftP||I.rightP)){setDiff((diffSet+(I.rightP?1:2))%3);sfx('hit');}
  if(o!==titleSel)sfx('hit');if(I.startP||I.jumpP)titleChoose(titleSel);}
function updateHowto(I){titleT++;camBG+=0.6;if(I.pauseP){state='title';titleSel=3;sfx('pause');return;}const o=howSel;
  if(I.downP)howSel=(howSel+1)%6;if(I.upP)howSel=(howSel+5)%6;if(o!==howSel)sfx('hit');
  if(I.startP||I.jumpP||I.fireP){if(howSel===5){state='title';titleSel=3;sfx('pause');}else openInfo(howSel);}}
function infoFlip(d){if(infoPage>=5)return;infoPage=(infoPage+d+5)%5;ctlTab=defCtlTab();sfx('hit');}
function updateInfo(I){titleT++;camBG+=0.6;if(I.pauseP||I.startP||I.jumpP||I.fireP){infoBack();return;}
  if(I.leftP)infoFlip(-1);if(I.rightP)infoFlip(1);if(infoPage===0&&(I.upP||I.downP)){ctlTab=(ctlTab+(I.downP?1:2))%3;sfx('hit');}}
function menuPointerV22(ix,iy,click){
  if(state==='title'){for(let i=0;i<TMENU.length;i++){const y=TMY(i);if(Math.abs(ix-W/2)<86&&iy>=y-1&&iy<y+TROW()-1){if(titleSel!==i&&!click)sfx('hit');titleSel=i;if(click)titleChoose(i);return true;}}return false;}
  if(state==='cards')return cardsPointer(ix,iy,click);
  if(state==='howto'){for(let i=0;i<6;i++){const y=HTY(i);if(Math.abs(ix-W/2)<86&&iy>=y-4&&iy<y+12){if(howSel!==i&&!click)sfx('hit');howSel=i;if(click){if(i===5){state='title';titleSel=3;sfx('pause');}else openInfo(i);}return true;}}return!!click;}
  if(state==='info'){if(!click)return true;if(Math.abs(ix-W/2)<40&&iy>=150&&iy<170){infoBack();return true;}
    if(infoPage<5&&iy>60&&iy<120){if(ix<30){infoFlip(-1);return true;}if(ix>W-30){infoFlip(1);return true;}}
    if(infoPage===0&&iy>=20&&iy<36)for(let i=0;i<3;i++)if(Math.abs(ix-CTL_TX[i])<44){ctlTab=i;sfx('hit');return true;}return true;}
  return null;}
