  RED RAIN - changelog
  ====================
  v2.2.4 (2026-11-21)
  - Arcade leaderboard (contract: arcade-handoff/LEADERBOARD-API.md). The only network traffic in the game,
    same origin, relative URL /api/scores.php, no third-party calls. Boards = difficulty keys 1:1
    (easy, normal, expert, insane).
  - A run token is requested when a run starts (op "start"). Played time counts real time while a run is
    on screen (play, wave-end, Armory, finale), not paused time and not time with the tab hidden.
  - At game over, runs of 30 s or more (or the server's minPlayedMs if higher) get an optional SAVE YOUR
    SCORE panel: a name box (a real <input>, so phones bring up their keyboard; 1-12 characters; the
    last name used is remembered in localStorage redRainLbName) with SUBMIT and SKIP. Enter submits and
    Esc skips while typing; Tab reaches the box. Shorter runs show a short note and send nothing.
  - Restarting is never blocked: Enter / Space / a click or tap outside the panel still plays again, and
    CHANGE DIFFICULTY still works. Nothing is sent unless SUBMIT is pressed.
  - Failures are quiet: opened as a local file the panel never appears and no request is made; a host
    without the leaderboard hides it; offline shows "Couldn't save score". HTTP 429 shows "Try again
    later."; other rejections show the server's own message. Score is clamped to the board's 0-5,000,000.
  v2.2.3 (2026-11-21)
  - Back to Arcade: Red Rain now lives on tylilo.com/arcade/red-rain/ and opens in the same tab, so the
    title menu and the pause screen get a BACK TO ARCADE button (keyboard: A, on those two screens only;
    A does nothing during play). It goes to /arcade/ in the same tab (window.location.href = '/arcade/').
    From the title screen it leaves straight away. From the pause screen it reuses the Main Menu confirm
    box: "Leave to the Arcade? Progress in this run will be lost." LEAVE (or Enter) saves a beaten high
    score for the difficulty, then leaves; CANCEL, Esc, P or a tap outside stays paused.
  - Layout: title menu is now PLAY, CONTROLS, OPTIONS, WHAT'S NEW, BACK TO ARCADE (a column on tall
    screens; one row of 5 on wide short screens; else rows of 3 + 2; a 2x2 grid with BACK TO ARCADE
    spanning a third row only on narrow short screens). Pause screen: RESUME, CONTROLS, OPTIONS, WHAT'S NEW, MAIN MENU, BACK TO ARCADE (a column, or on
    short screens RESUME across the top, then 3 + 2 buttons; 2 columns + a spanning row on narrow ones).
  - Accessibility: a real (visually hidden) "Back to Arcade" button outside the canvas gives screen
    readers and Tab users an accessible name. It exists only while the title or pause screen is showing
    with no overlay open, shows itself when focused, and does exactly what the canvas button does.
  - Controls / How to Play and What's New updated.
  v2.2.2 (2026-11-21)
  - New explosion sounds, still 100% synthesized in Web Audio (no audio files). Every interceptor blast,
    chain blast, city/ground impact and nuke is now built from four layers: a sharp 1-2 ms crack
    (band-passed noise), a body (low-passed noise whose filter sweeps down), a sub-bass thump (sine
    falling from ~120 Hz to ~35 Hz) and a rolling rumble tail (double low-passed noise).
  - A shared explosion bus adds mild tanh saturation for grit, a short reverb (one ConvolverNode with a
    generated decaying-noise impulse) so blasts ring out over the city, and a compressor so big chain
    reactions stay full instead of clipping. It feeds the existing Effects volume, so the Sound effects
    toggle, Effects volume, M mute, pause and tab-hidden suspend work exactly as before.
  - Weight and length step up: interceptor blast < chain blast < city impact < nuke. City hits add debris
    crackles; the nuke has a huge crack, a ~24 Hz sub, a ~4 s rolling rumble and a second shockwave.
  - Each explosion varies slightly (pitch, filter, decay) and is panned left/right (up to +-0.7) to where
    it happens on screen.
  - Performance: one shared noise buffer, one reverb and one compressor for all explosions; the 40 ms
    blast/chain throttle and the 40-voice cap stay (4 voices per boom; blasts/chains leave 8 voices free for impacts, nukes and other
    sounds; debris is dropped near the cap).
    The fireworks pop sound is unchanged.
  v2.2.1 (2026-11-21)
  - Versioning is now MAJOR.MINOR.BUILD. BUILD goes up by 1 with every shipped release and never
    resets; MINOR moves only when a roadmap milestone is reached. v2.2 is read as 2.2.0.
  - What's New: a WHAT'S NEW button on the title menu and in the pause screen's button grid (also the
    W key on the title and pause screens) opens a scrollable overlay listing every release from 2.2.1
    back to 1.0, newest first, in plain player language (built from the WHATS_NEW data array). It never
    opens by itself. Close with CLOSE, Esc, W or a tap outside; gameplay gets no taps while it is open.
    The Controls / How to Play overlay mentions it.
  - Favicon: an original inline SVG icon (dark red night sky, red moon, falling missile with a glowing
    trail, city skyline) on <link rel="icon">, plus a 180x180 PNG apple-touch-icon. Both are data URIs,
    so the game is still one self-contained file.
  - Copyright: a small, muted "(c) <current year> Tylilo, LLC" line next to the version tag on the
    title and pause screens. The year comes from the device clock.
  - Title menu: PLAY, CONTROLS, OPTIONS and WHAT'S NEW. Stacked on tall screens, a 2x2 grid or a single
    row on short ones; buttons shrink (never below 44 px) so everything fits on short landscape phones.
    Pause screen: RESUME, CONTROLS, OPTIONS, WHAT'S NEW, MAIN MENU (RESUME spans the top row in the
    grid layout used on short screens).
  - Accessibility: pinch zoom is allowed again. The viewport no longer sets maximum-scale=1 or
    user-scalable=no. The canvas uses touch-action: pinch-zoom (instead of none), so one-finger taps
    still fire instantly and never scroll, pan or double-tap zoom, while a two-finger pinch zooms and
    pans. The document touch handlers now block only one-finger moves (page scroll / pull-to-refresh)
    and no longer cancel multi-touch or iOS gesture events. Ctrl + wheel / trackpad pinch zoom works on
    desktop. While the page is pinch-zoomed the game keeps its unzoomed layout (iOS Safari reports the
    zoomed visual size in innerWidth/innerHeight) and re-lays out when zoom returns to 100%.

  v2.2 (2026-10-04)
  - Optimization and cleanup pass. Gameplay, balance, visuals and rules are unchanged; still one file.
    - Rendering: static gradients (turrets, flak, bombers, stealth, nukes, drones, crates, HUD, fog,
      reflections, missile trails and cores, fireballs, smoke) are built once and cached per layout.
      Missiles draw in a rotated local frame with no save/restore. Stars, sparks, smoke, rivets, ammo pips,
      windows and missile paths are batched by colour/alpha bucket. Fewer composite-mode switches.
    - Simulation: particles are pooled. Dead objects are removed by in-place compaction instead of
      per-frame .filter() copies. The first-frame dt is clamped to >= 0.
    - Tab hidden: the game pauses, the loop idles, and the AudioContext suspends; both resume on return.
    - Audio: shared noise buffer, a 40-voice SFX cap, SFX skipped while audio is suspended, and the
      crackle tail scheduled on the audio clock. Music volume/filter automation runs only on change.
      iOS: unlock on the first touch with a silent buffer, and recover from the 'interrupted' state.
    - Resize/orientation/fullscreen/visualViewport events are coalesced into one re-layout per frame.
      devicePixelRatio changes (moving between monitors) re-layout too. Older-WebKit fullscreen exit
      is supported.
  - Bug fixes:
    - Options sliders wrote localStorage on every pointer move; now saved on release and on tab hide.
    - Crackle SFX used setTimeout, so sounds fired after pausing, quitting or hiding the tab.
    - Wrecked-turret smoke came from the renderer, so its amount scaled with the display refresh
      rate (double on 120 Hz). It is now emitted by the simulation at the same 60 fps rate.
    - Music re-issued gain/filter automation every frame, which kept growing the audio param timelines.
    - The first frame could get a negative dt (rAF timestamp earlier than the start time).
    - The game kept the AudioContext running while the tab was hidden. Quit to Menu now also clears
      finale state and recycles particles. Removed an unused variable.

  v2.1 (2026-10-04)
  - Armory rebalance (explicit price per level; Insane still multiplies every price by 1.25):
    - Blast Radius   L1-5: $250, $500, $900, $1400, $2000   (was 120/240/360/480/600)
    - Rocket Motors  L1-5: $200, $400, $750, $1200, $1800   (was 100/200/300/400/500)
    - Magazines      L1-5: $200, $400, $700, $1100, $1600   (was 90/180/270/360/450)
    - Extra Turret   1st $1200, 2nd $2500                    (was 450 / 750)
    - Auto Flak      L1-3: $1500, $2500, $4000               (was 550/350/700 - level 2 is no longer cheaper than level 1)
    - Builder Crew   $600 + $75 x wave                       (was 160 + 25 x wave)
    - Turret Shield  $1500                                   (was 450)
    - Rebuild City and City Shield unchanged.

  v2.0 (2026-10-04)
  - New loss condition: if every unlocked turret is destroyed at the same moment during a wave, the
    game ends even with cities standing (turrets still rebuild between waves as before).
  - Finale (~5 s): input is locked (no firing or pausing), a pulsing DEFENSES DOWN banner and alarm,
    then a dense barrage rains down with at least one warhead aimed at every standing city (staggered
    big blasts, screen shake that respects Options > Screen shake, sound). City shields flash and break
    but don't save the city; an active Builder Crew site is destroyed too. Finale warheads can't be
    shot down. When the skyline is rubble the normal game over screen appears with the reason
    "All turrets destroyed" (or "All cities destroyed" for the usual loss); high scores save per
    difficulty as normal.

  v1.9 (2026-10-03)
  - Visual overhaul (same gameplay, timings and hitboxes; still one file, no external assets, all original art):
    - Lighting: one key light (the red moon, upper right) drives rim lights and highlights on everything,
      plus a warm glow from below during explosions: blasts and nukes light up nearby buildings and
      throw light pools on the ground.
    - Sky: layered gradient, three parallax mountain ranges with atmospheric perspective (farther = hazier),
      drifting clouds, twinkling stars, and a shaded moon with a soft halo and craters.
    - Cities: extruded buildings (oblique projection) with a lit front face and darker side, roofs with
      water towers / AC units / blinking antennas, window grids with lit and flickering panes, a ground
      reflection and fog at the base. Ruins: 3D debris piles with broken stumps, smoke and glowing embers.
    - Turrets: brushed-metal bunkers, shaded dome with a specular highlight, a cylinder-shaded barrel that
      aims at the last shot, and a muzzle flash. Auto Flak shaded to match.
    - Missiles: shaded bodies, additive exhaust glow, smoke trails that widen and fade; bombers, stealth
      bombers, drones, nukes and supply crates get gradient shading and rim light; low threats cast
      ground shadows.
    - Explosions: smoke + fireball core/flame + additive halo, a shockwave ring with a darker distortion
      edge, and debris sparks. The mushroom cloud uses volumetric (lit/shadowed) puffs and an underglow.
    - Shields: glassy domes with a Fresnel-bright rim, a shimmering hex lattice and a refraction highlight.
    - UI: frosted glass HUD bar and buttons, rounded panels with soft shadows, a system font stack, and
      Armory cards with icons and depth.
  - Options > Graphics: HIGH / LOW. Defaults to High on desktop and Low on small or low-end devices.
    Low turns off glows, shadows, reflections, clouds and the parallax layers.
  - Performance: sky, moon, mountains, ground and every city are pre-rendered to offscreen canvases and
    re-rendered only on resize, quality change, or when a city is destroyed/rebuilt; glows use cached sprites.
    The canvas backing store is capped at 2x device pixels (3x phones looked the same at 2.25x the cost).

  v1.8 (2026-10-03)
  - Pause screen: RESUME, CONTROLS, OPTIONS and a new MAIN MENU button (large touch targets; a 2x2
    grid on short screens). MAIN MENU asks "Quit to main menu? Progress in this run will be lost."
    with QUIT and CANCEL (Esc, P or a tap outside cancels and stays paused). QUIT ends the run
    cleanly: the high score for the current difficulty is saved if beaten, all enemies, shots,
    explosions, particles, crates, builders, shields-in-flight effects, fireworks, the banner plane
    and any shake/flash are cleared, the music returns to the calm title mood, and the title screen
    opens with the same difficulty selected.

  v1.7 (2026-10-03)
  - Difficulty levels: Easy (exactly the v1.6 tuning), Normal, Expert and Insane, chosen on the title
    screen with four large buttons (click/tap, or arrow keys / 1-4 then Enter). Last choice is saved
    (default Easy). Active difficulty shown in the HUD, pause and game over screens; game over has a
    "Change difficulty" button back to the title.
      Normal: missiles x1.25, speed x1.12, enemy types 1 wave earlier, deliberate misses x0.8
      Expert: missiles x1.55, speed x1.25, types 3 waves earlier, misses x0.4, ammo -2/turret,
              kill money x0.85, fewer crates (max 1 / 1 / 2 per wave instead of 1 / 2 / 3)
      Insane: missiles x1.9, speed x1.4, types 5 waves earlier (never before wave 2), no deliberate
              misses, ammo -4/turret, kill and wave-bonus money x0.7, fewer crates and half crate
              ammo, Armory prices x1.25
    Launch spacing tightens with the extra missiles (gap / count-multiplier^0.5-0.7) so waves don't
    simply get longer. All earlier rules (crate caps, Builder Crew, shields, nukes, rebuild charges,
    no bomber cap) apply on every difficulty.
  - Separate high score per difficulty (the existing high score becomes Easy's); the title shows the
    high score for the selected difficulty.
  - Cleaner title screen: just the title, difficulty selector, PLAY and CONTROLS buttons and the high
    score. CONTROLS (also H or ?) opens an overlay listing the controls (keys on desktop, on-screen
    buttons on touch devices) plus a short How to Play. Close with the Close button, Esc, H, or a
    tap outside; it scrolls on short screens. The pause screen also has a CONTROLS button and no
    longer shows key hints.
  - OPTIONS (title, below Controls; and on the pause screen): Music on/off (synced with N and the
    note button), Sound effects on/off (separate from music; M still mutes everything), Music and
    Effects volume, display sliders for Brightness, Contrast and Saturation (CSS filter on the
    canvas), Screen shake 0-100% (also scales the nuke's full-screen shake; 0% = none), Particles
    Low/Med/High, and Reset to defaults. Settings apply live and are saved. Large drag areas for
    touch and mouse; keyboard: Up/Down to pick, Left/Right to adjust, Enter to toggle, Esc to close.
  v1.6 (2026-10-03)
  - Nukes can only be damaged by the player's own interceptor blasts: Auto Flak never targets them,
    and chain-reaction blasts (including the stealth bomber's death blast) and enemy blasts never
    affect them.
  - Nukes have 2 HP like stealth bombers: a DIRECT HIT (interceptor detonating within 18 world units
    x HIT of the nuke's centre) destroys it in one shot (+1,000 bonus, +$40); a nearby regular blast
    does 1 damage ("HIT - 1 MORE", sparks, faster warning blink) and 2 kill it. Each blast counts once.
  - Airburst: the nuke detonates in the air about one city height above the rooftops (108 base units
    x structure scale above the ground) instead of on the ground. Flash, shockwave, full-screen shake
    and the mushroom cloud originate at that height (dust column rises from the ground to the cap).
    Damage and shield rules unchanged (target under it + nearest neighbour).
  - Nukes accelerate: they start at the same fall speed as before (max(22, 0.5 x enemy speed) x vS)
    and gain 25% of that speed every second until the airburst, so they arrive sooner.
  - Rebuild City (instant) now uses rebuild charges as well as money: start with 1, earn +1 after
    every 6 waves cleared (6, 12, 18, ...), max 3 stored (a charge earned while at 3 is lost). With
    0 charges the card is disabled with "Next charge after wave N"; the card shows "Charges c/3".
    Builder Crew is unaffected.
  v1.5 (2026-10-03)
  - Stealth bombers: a DIRECT HIT kills in one shot - an interceptor detonating within 22 world units
    (x HIT, so larger on small screens; about the bomber's half-length) of its centre. Bonus +1,000
    points and +$40 with a "DIRECT HIT!" popup. Edge hits and chain blasts are regular hits (1 damage,
    2 to kill, "HIT - 1 MORE" + smoke). Auto Flak never targets bombers.
  - City Shield price raised: 3000 x 1.5^(shields bought) + 150 x (wave - 1), rounded to $10
    ($3,000 for the first one at wave 1).
  v1.4 (2026-10-03)
  - Regular bombers: no per-wave cap any more and faster growth - 1 + floor((wave - 6) / 2) from
    wave 6 (6: 1, 8: 2, 10: 3, 14: 5, 20: 8, 30: 13, ...). Their entries are staggered evenly across
    the wave (with a little jitter) so they don't all overlap. Bomb drop interval unchanged; no bomb cap.
  - 1,000,000 points celebration: the first time the score crosses one million in a game, ~9 s of
    original fireworks (rising rockets, multicolour peony / ring / golden willow / crackling glitter
    bursts with gravity and fade) play in the background layer behind cities and enemies, with
    pop/crackle sounds (muted by M). Fireworks are purely visual: no collisions, gameplay continues
    untouched. Once per game; resets on a new game.
  - A small propeller plane tows a waving "1,000,000!" banner across the upper sky during the show.
    It is not an enemy (not in INCOMING, not needed to clear the wave, ignored by Auto Flak) and flies
    off-screen if left alone. Shoot it and it catches fire, the banner flutters away, and it arcs down
    into the ground: the crash hits like an enemy warhead (destroys a city/turret it lands on, breaks a
    shield instead if there is one, fails a Builder Crew site). No points - just an "OOPS! -0".
  - Nuke detonations now shake the ENTIRE screen - world and HUD (score, wave, buttons) - for ~1.9 s:
    strong initial jolt decaying away plus a low-frequency rumble wobble. Only the drawing moves, so
    taps/clicks stay accurate. Phones that support it also vibrate (after the first tap).
  v1.3 (2026-10-03)
  - City Shield (Armory): each purchase raises a dome over one random standing, unshielded city
    (never rubble or a Builder Crew site). The dome absorbs exactly one enemy hit (missile, bomb,
    splitter child or drone) with the shield flash and "SHIELD DOWN", then it's gone. Player blasts
    never affect it; it lasts across waves until hit. Price: 200 x 1.5^(shields bought) + 30 x wave.
    Newly shielded cities get a "SHIELD UP" popup and a bright pulse at the start of the next wave.
  - Armory now has 9 cards: 2 columns on narrow screens, 4 when three rows fit, otherwise 5 on wide
    short screens (e.g. landscape phones); the last row is centred and the list still scrolls if needed.
  - Stealth bombers from wave 11 (1 per wave, +1 every 4 waves, max 3): an original dark flying-wing
    design that crosses high and slow and takes 2 hits (smoking after the first). Over a ground target
    it drops one nuke (big slow bomb, blinking warning ring, siren beep). Shoot the nuke (1 hit, big
    score; its blast is harmless) or kill the bomber before the drop. A nuke that lands destroys the
    target under it plus the nearest neighbouring city or turret; a shield on either target absorbs
    the blast for that target only (shield breaks); a Builder Crew site in range fails. Impact shows
    a white flash, shockwave ring, screen shake, a 3-4 s mushroom cloud and a deep rumble.
  v1.2 (2026-10-03)
  - Full screen: press F (or the new full-screen button next to pause/mute) to toggle full screen
    via the Fullscreen API (webkit-prefixed fallback for Safari; errors ignored). The button is
    hidden where the API isn't available (e.g. iPhone Safari). Layout re-fits on fullscreenchange.
  - Background music: an original procedural soundtrack synthesized live with WebAudio (no files) -
    a moody looping electronic track with bass pulse, pads and an arpeggio. Calm on the title and in
    the Armory, a little more intense during waves, ducked while paused, quieter than the effects.
    On by default (starts on the first tap/click/key); toggle with the new note button or N.
    Setting saved in localStorage. M still mutes everything, music included.
  - Key hints on the title and pause screens now mention N music and F full screen.
  - Narrow phones: wave / incoming info moves to a thin strip under the score row so the
    four top-right buttons fit.
  v1.1 (2026-10-03)
  - Truly responsive layout: the world is sized to the viewport's aspect ratio (no letterboxing),
    rendered crisply with devicePixelRatio, and re-laid-out live on resize / rotation, even mid-wave
    (cities, turrets, missiles, drones, crates, builders and the shield are remapped proportionally).
  - Portrait phones get a tall playfield; missile/interceptor/crate speeds scale with the fall
    distance so difficulty feels equivalent. Buildings scale to the width.
  - Safe-area insets (notches / home indicator) via env(safe-area-inset-*) and viewport-fit=cover.
  - Scale capped on tablets/desktops. HUD, title, wave summary, pause, game over and the Armory are
    drawn in screen pixels and reflow (Armory: 4 columns on wide screens, 2 on narrow, scrollable,
    touch targets >= 44px). Bigger pause/mute buttons on touch devices.
  - Blast radius and drone/crate/bomber hitboxes grow on small screens so they stay tappable.
  - Page scroll, pinch/double-tap zoom and pull-to-refresh are blocked. Rotate tip removed.
  v1.0 (2026-10-03)
  - Missile defense core: click/tap to launch interceptors whose blasts chain-react; cities,
    turrets, waves, score/money, high score (localStorage), pause, mute, particles, screen shake,
    responsive canvas with touch support.
  - The Armory between waves: Rebuild City (instant), Blast Radius, Rocket Motors, Magazines,
    Extra Turret, Auto Flak.
  - Parachute ammo crates: shoot them for bonus ammo (capped per wave, never over turret max).
  - Kamikaze drones: cruise in a random distance, telegraph with a red blink, then dive.
  - Builder Crew: one-time purchase; workers rebuild a ruined city over one wave unless hit.
  - Turret Shield: one-time purchase after wave 5; dome over the center turret absorbs one hit.
  - Gentler difficulty curve: small per-wave increases, enemy types introduced one at a time.
  - Auto turret slowed down and limited to falling missiles and bombs (direct hits only).

<style>
  html,body{margin:0;padding:0;width:100%;height:100%;background:#07040f;overflow:hidden;

  /* v2.2.3: visually hidden Back to Arcade button (accessible name for screen readers / Tab users) */
  #arcadeA11y{position:fixed;left:0;top:0;width:1px;height:1px;margin:-1px;padding:0;border:0;overflow:hidden;

  #arcadeA11y:focus{left:calc(env(safe-area-inset-left,0px) + 12px);top:calc(env(safe-area-inset-top,0px) + 12px);

<body>
<canvas id="c" aria-label="Red Rain game"></canvas>
<div id="safe"></div>
<button id="arcadeA11y" type="button" aria-label="Back to Arcade" hidden>Back to Arcade</button>
<input id="lbName" type="text" maxlength="12" autocomplete="nickname" autocapitalize="words" autocorrect="off" spellcheck="false" enterkeyhint="send" placeholder="YOUR NAME" aria-label="Your name for the Arcade leaderboard">
<script>
(() => {
'use strict';
const VERSION = '2.2.4';   // MAJOR.MINOR.BUILD - BUILD +1 per shipped release, never reset
document.title = 'Red Rain v' + VERSION;
// ---------- helpers ----------
const canvas = document.getElementById('c');
let ctx = canvas.getContext('2d', { alpha: false });   // reassigned briefly while painting offscreen layers
const safeProbe = document.getElementById('safe');
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const dist2 = (ax, ay, bx, by) => (ax - bx) * (ax - bx) + (ay - by) * (ay - by);
const HS_KEY = 'redReignHighScore'; // key kept from earlier builds so saved high scores survive
// ---------- difficulty levels (Easy = the original tuning, untouched) ----------
const DIFF_ORDER = ['easy', 'normal', 'expert', 'insane'];
const DIFFS = {
  easy:   { name: 'Easy',   desc: 'Gentle waves - learn the ropes', col: '#8fe08a', count: 1,    speed: 1,    gapExp: 0,   shift: 0, stray: 1,   ammo: 0,  money: 1,    bonusMoney: 1,   fewerCrates: false, crateAmmo: 1,   price: 1 },
  normal: { name: 'Normal', desc: 'More, faster missiles',          col: '#ffd166', count: 1.25, speed: 1.12, gapExp: 0.5, shift: 1, stray: 0.8, ammo: 0,  money: 1,    bonusMoney: 1,   fewerCrates: false, crateAmmo: 1,   price: 1 },
  expert: { name: 'Expert', desc: 'Big waves, tight ammo',          col: '#ff9e40', count: 1.55, speed: 1.25, gapExp: 0.6, shift: 3, stray: 0.4, ammo: -2, money: 0.85, bonusMoney: 1,   fewerCrates: true,  crateAmmo: 1,   price: 1 },
  insane: { name: 'Insane', desc: 'Relentless. No mercy.',          col: '#ff4d6d', count: 1.9,  speed: 1.4,  gapExp: 0.7, shift: 5, stray: 0,   ammo: -4, money: 0.7,  bonusMoney: 0.7, fewerCrates: true,  crateAmmo: 0.5, price: 1.25 },
};
const DIFF_KEY = 'redRainDifficulty';
let selDiff = 'easy';
try { const s = localStorage.getItem(DIFF_KEY); if (DIFFS[s]) selDiff = s; } catch (e) {}
const hsKey = d => d === 'easy' ? HS_KEY : HS_KEY + '_' + d;   // Easy keeps the original key = migrated score
const hiScores = {};
DIFF_ORDER.forEach(d => { try { hiScores[d] = parseInt(localStorage.getItem(hsKey(d)) || '0', 10) || 0; } catch (e) { hiScores[d] = 0; } });
const curDiff = () => (G && G.diff) || 'easy';
const DF = () => DIFFS[curDiff()];
function setSelDiff(d) { if (!DIFFS[d]) return; selDiff = d; try { localStorage.setItem(DIFF_KEY, d); } catch (e) {} }

// ---------- responsive layout ----------
// World units: W x H sized to the viewport aspect. k = CSS px per world unit.
// PL..PR = horizontal play band inside safe-area insets; GROUND = ground line.
let dpr = 1, cssW = 0, cssH = 0, k = 1, W = 960, H = 600, GROUND = 556, PL = 0, PR = 960;
let gs = 1, vS = 1, hS = 1, HIT = 1, LW = 1, u = 1, portrait = false, isTouch = false;
const safe = { t: 0, r: 0, b: 0, l: 0 };
const BASE_GROUND = 556, BASE_W = 960;
const CITY_F = [150, 235, 320, 640, 725, 810].map(x => x / BASE_W);
const TURRET_F = [60, 480, 900].map(x => x / BASE_W);
const AUTO_F = 400 / BASE_W;
const posX = f => PL + f * (PR - PL);
let titleCities = [];
let G = null;

function readSafe() {
  const s = getComputedStyle(safeProbe);
  safe.t = parseFloat(s.paddingTop) || 0; safe.r = parseFloat(s.paddingRight) || 0;
  safe.b = parseFloat(s.paddingBottom) || 0; safe.l = parseFloat(s.paddingLeft) || 0;
}
// v2.2.1: pinch zoom is allowed. iOS Safari reports the zoomed-in visual size in innerWidth/innerHeight,
// but the fixed canvas still covers the unzoomed layout viewport, so while zoomed keep the current size.
const pinchZoomed = () => !!(window.visualViewport && window.visualViewport.scale > 1.01);
function viewSize() {
  if (pinchZoomed() && cssW > 1 && cssH > 1) return { w: cssW, h: cssH };
  if (pinchZoomed()) { const de = document.documentElement; return { w: Math.max(1, de.clientWidth || window.innerWidth), h: Math.max(1, de.clientHeight || window.innerHeight) }; }
  return { w: Math.max(1, window.innerWidth), h: Math.max(1, window.innerHeight) };
}
function layout() {
  GRAD.clear();   // cached gradients that embed layout values
  const old = { W, H, GROUND, PL, PR, k };
  dpr = Math.min(window.devicePixelRatio || 1, 2);   // v1.9: backing store capped at 2x (3x phones looked identical but cost 2.25x the fill)
  const vsz = viewSize(); cssW = vsz.w; cssH = vsz.h;
  canvas.width = Math.round(cssW * dpr); canvas.height = Math.round(cssH * dpr);
  readSafe();
  isTouch = (window.matchMedia && matchMedia('(pointer: coarse)').matches) || (navigator.maxTouchPoints || 0) > 0;
  const aw = cssW - safe.l - safe.r, ah = cssH - safe.t - safe.b;
  portrait = ah > aw * 1.05;
  // shorter side maps to ~600 world units (480 in portrait so things stay big), capped on big screens
  k = clamp(Math.min(aw, ah) / (portrait ? 480 : 600), 0.45, 1.5);
  W = cssW / k; H = cssH / k;
  PL = safe.l / k + 8; PR = W - safe.r / k - 8;
  GROUND = H - safe.b / k - 44;

// ---------- difficulty curve: small smooth per-wave increments with caps ----------
function waveSpec(n) {
  const d = DF();
  if (d === DIFFS.easy) return waveSpecBase(n);
  const b = waveSpecBase(n), t = waveSpecBase(n <= 1 ? 1 : n + d.shift);   // t: enemy-type schedule shifted earlier (never on wave 1)
  const count = Math.round(b.count * d.count);
  const maxSpecial = Math.floor(count * 0.6);
  const nFast = Math.min(t.nFast, Math.ceil(maxSpecial / 2)), nSplit = Math.min(t.nSplit, maxSpecial - nFast);
  return Object.assign({}, b, {
    count, nFast, nSplit,
    speed: b.speed * d.speed,
    gap: Math.max(0.5, b.gap / Math.pow(d.count, d.gapExp)),
    salvos: t.salvos, salvoSize: t.salvoSize, nStealth: t.nStealth, nBomb: t.nBomb, nDrone: t.nDrone, splitKids: t.splitKids,
    stray: b.stray * d.stray,
    ammo: Math.max(6, b.ammo + d.ammo),
  });
}
function waveSpecBase(n) {
  const count = Math.min(32, Math.round(5 * Math.pow(1.09, n - 1)));      // +9%/wave
  let nFast = n >= 3 ? 1 + Math.floor((n - 3) * 0.6) : 0;                  // fast from wave 3
  let nSplit = n >= 5 ? 1 + Math.floor((n - 5) * 0.5) : 0;                 // splitters from wave 5
  const maxSpecial = Math.floor(count * 0.6);
  nFast = Math.min(nFast, Math.ceil(maxSpecial / 2)); nSplit = Math.min(nSplit, maxSpecial - nFast);
  return {
    count, nFast, nSplit,
    speed: Math.min(115, 28 * Math.pow(1.07, n - 1)),                      // +7%/wave (base units; scaled by vS)
    gap: Math.max(0.8, 3.4 * Math.pow(0.94, n - 1)),                        // spawn rate +~6%/wave
    salvos: n >= 4 ? Math.min(6, 1 + Math.floor((n - 4) / 2.5)) : 0,
    salvoSize: n >= 12 ? 3 : 2,
    nStealth: n >= 11 ? Math.min(3, 1 + Math.floor((n - 11) / 4)) : 0,      // stealth bombers from wave 11
    nBomb: n >= 6 ? 1 + Math.floor((n - 6) / 2) : 0,                        // bombers from wave 6, no ceiling
    nDrone: n >= 7 ? Math.min(8, 1 + Math.floor((n - 7) / 3)) : 0,          // drones from wave 7
    stray: Math.max(0, 0.5 - 0.06 * (n - 1)),                               // early warheads often miss
    ammo: Math.min(22, 10 + n),                                             // base shots per turret
    splitKids: n >= 10 ? 3 : 2,
  };
}

function buildSchedule(n) {
  const sp = waveSpec(n), sched = [];
  const types = [];
  for (let i = 0; i < sp.count; i++) types.push(i < sp.nFast ? 'fast' : i < sp.nFast + sp.nSplit ? 'split' : 'normal');
  for (let i = types.length - 1; i > 0; i--) { const j = randi(0, i); [types[i], types[j]] = [types[j], types[i]]; }
  for (let i = 0; i < sp.count; i++) sched.push({ t: 1.5 + i * sp.gap + rand(-0.3, 0.3) * sp.gap, type: types[i] });
  const dur = 1.5 + sp.count * sp.gap;
  for (let s = 0; s < sp.salvos; s++) {
    const t = 1.5 + (randi(1, sp.count - 1) + 0.5) * sp.gap;
    for (let q = 0; q < sp.salvoSize; q++) sched.push({ t: t + q * 0.15, type: 'normal' });
  }
  // bombers: evenly staggered entries across the wave (+/- 30% of the slot) so they don't bunch up
  { const span = Math.max(1, dur - 6), slot = span / Math.max(1, sp.nBomb);
    for (let b = 0; b < sp.nBomb; b++) sched.push({ t: 3 + (b + 0.5) * slot + rand(-0.3, 0.3) * slot, type: 'bomber' }); }
  for (let b = 0; b < sp.nStealth; b++) sched.push({ t: rand(3, Math.max(4, dur - 6)), type: 'stealth' });
  for (let d = 0; d < sp.nDrone; d++) sched.push({ t: rand(3, Math.max(4, dur - 2)), type: 'drone' });
  sched.sort((a, b) => a.t - b.t);
  return { sched, dur };
}

function pickTarget() {

  if (!opts.length) return { x: rand(PL + 30, PR - 30), y: GROUND };

    if (a.cd <= 0 && tgt) {
      a.cd = autoInterval();
      a.shots = (a.shots || 0) + 1;
      G.beams.push({ x1: a.x, y1: GROUND - 20 * gs, x2: tgt.x, y2: tgt.y, t: 0.15 });
      // direct hit on the chosen warhead only: no area blast, no chain reaction
      tgt.dead = true;
      addKill(tgt.type, 0, tgt.x, tgt.y);
      G.explosions.push({ x: tgt.x, y: tgt.y, r: 2, maxR: 10, t: 0, life: 0.35, owner: 'flakfx', chain: 0 });
      for (let i = 0; i < 8; i++) addP(tgt.x, tgt.y, rand(-70, 70), rand(-70, 70), 0.35, 0.35, '#bfffb5', 2, 0);
      SFX.laser();
    }
  }

  // explosions
  for (const ex of G.explosions) {
    ex.t += dt;
    const p = ex.t / ex.life;
    ex.r = p < 0.35 ? ex.maxR * Math.sin(p / 0.35 * Math.PI / 2) : p < 0.65 ? ex.maxR : ex.maxR * (1 - (p - 0.65) / 0.35);
    if (p >= 1) ex.dead = true;
    if (ex.owner !== 'player' || ex.r <= 1) continue;
    for (const m of G.enemies) {
      if (m.dead || m.finale) continue;
      const pad = m.type === 'nuke' ? 9 * HIT : 0;
      if (dist2(m.x, m.y, ex.x, ex.y) > (ex.r + pad) * (ex.r + pad)) continue;
      if (m.type === 'nuke') {
        // only the player's own interceptor detonations count; chains/flak/enemy blasts never do
        if (!ex.shot || ex.chain !== 0) continue;
        if (!m.hits) m.hits = new WeakSet();
        if (m.hits.has(ex)) continue;
        m.hits.add(ex);
        if (dist2(m.x, m.y, ex.x, ex.y) <= NUKE_DIRECT_R() * NUKE_DIRECT_R()) {
          m.hp = 0; m.direct = true; G.score += 1000; G.money += 40;
          G.floaters.push({ x: m.x, y: m.y - 34, text: 'DIRECT HIT! +1000', t: 1.8, c: '#ffe066' });
        } else m.hp--;
        if (m.hp > 0) {
          m.dmgT = 0.4;
          for (let i = 0; i < 14; i++) addP(m.x + rand(-6, 6), m.y, rand(-90, 90), rand(-90, 60), 0.5, 0.5, i % 2 ? '#ffb347' : '#ffffff', 2, 80);
          G.floaters.push({ x: m.x, y: m.y - 24, text: 'HIT - 1 MORE', t: 1.2, c: '#ffb347' });
          SFX.chain(sfxPan(m.x));
          continue;
        }
      }
      m.dead = true;
      addKill(m.type, ex.chain, m.x, m.y);
      if (m.type === 'nuke') { G.floaters.push({ x: m.x, y: m.y - 22, text: 'NUKE DOWN!', t: 1.8, c: '#ffe066' }); G.shake = Math.max(G.shake, 5); }
      explode(m.x, m.y, Math.max(16, blastRadius() * 0.6), 'player', ex.chain + 1);
      SFX.chain(sfxPan(m.x));
    }
    for (const b of G.bombers) {
      const pad = (b.kind === 'stealth' ? 22 : 14) * HIT;
      if (b.dead || dist2(b.x, b.y, ex.x, ex.y) > (ex.r + pad) * (ex.r + pad)) continue;
      if (b.kind === 'stealth') {
        // each blast counts once; 2 hits to kill
        if (!b.hits) b.hits = new WeakSet();
        if (b.hits.has(ex)) continue;
        b.hits.add(ex);
        // direct hit: the interceptor's own detonation (not a chain) right on the airframe
        if (ex.chain === 0 && dist2(b.x, b.y, ex.x, ex.y) <= STEALTH_DIRECT_R() * STEALTH_DIRECT_R()) {
          b.hp = 0; b.direct = true;
          G.score += 1000; G.money += 40;
          G.floaters.push({ x: b.x, y: b.y - 26, text: 'DIRECT HIT! +1000', t: 1.8, c: '#ffe066' });
        } else b.hp--;
        if (b.hp > 0) {
          b.dmgT = 0.4;
          for (let i = 0; i < 14; i++) addP(b.x + rand(-12, 12), b.y, rand(-90, 90), rand(-90, 60), 0.5, 0.5, i % 2 ? '#ffb347' : '#ffffff', 2, 80);
          G.floaters.push({ x: b.x, y: b.y - 20, text: 'HIT - 1 MORE', t: 1.2, c: '#ffb347' });
          SFX.chain(sfxPan(b.x));
          continue;
        }
      }
      b.dead = true;
      addKill(b.kind === 'stealth' ? 'stealth' : 'bomber', ex.chain, b.x, b.y);
      explode(b.x, b.y, blastRadius() * 0.9, 'player', ex.chain + 1);
      G.shake = Math.max(G.shake, 6);
      SFX.blast(sfxPan(b.x));
    }
    for (const d of G.drones) {
      if (d.dead || dist2(d.x, d.y, ex.x, ex.y) > (ex.r + 9 * HIT) * (ex.r + 9 * HIT)) continue;
      d.dead = true; G.droneKills++;
      addKill('drone', ex.chain, d.x, d.y);
      explode(d.x, d.y, Math.max(20, blastRadius() * 0.7), 'player', ex.chain + 1);
      SFX.chain(sfxPan(d.x));
    }
    if (G.bplane && G.bplane.state === 'fly' && dist2(G.bplane.x, G.bplane.y, ex.x, ex.y) < (ex.r + 16 * bpS()) * (ex.r + 16 * bpS())) shootBannerPlane();
    // only player blasts (incl. chains & auto flak blasts) collect crates; enemy impacts never do
    for (const c of G.crates) {
      if (c.dead || dist2(c.x, c.y, ex.x, ex.y) > (ex.r + 12 * HIT) * (ex.r + 12 * HIT)) continue;
      collectCrate(c);
    }
  }

  for (const bm of G.beams) bm.t -= dt;

  // floaters
  for (const f of G.floaters) { f.t -= dt; f.y -= 30 * dt; }
  for (const c of G.cities) if (c.shield && c.shield.glow > 0) c.shield.glow -= dt;
  for (const n of G.nukes) n.t += dt;
  { const a = G.nukes; let j = 0; for (let i = 0; i < a.length; i++) if (a[i].t < 4) a[j++] = a[i]; a.length = j; }
  if (G.flash > 0) G.flash = Math.max(0, G.flash - dt * 1.4);
  if (G.quake) { G.quake.t += dt; if (G.quake.t >= G.quake.dur) G.quake = null; }

  // city smoke

    if (c.alive || (G.build && G.build.phase === 'active' && G.cities[G.build.cityIdx] === c)) continue;
    c.smokeT -= dt;
    if (c.smokeT <= 0) { c.smokeT = rand(0.08, 0.2); addP(c.x + rand(-25, 25) * gs, GROUND - 6, rand(-6, 10), rand(-40, -20), 2.2, 2.2, 'smoke', rand(4, 8), -4); }
  }
  turretSmoke(dt);

  updateParticles(dt);

  // cleanup
  // cleanup: in-place compaction (no per-frame array allocations)
  pruneDead(G.enemies); pruneDead(G.bombers); pruneDead(G.drones); pruneDead(G.shots);
  pruneDead(G.explosions); pruneDead(G.crates);
  pruneT(G.beams); pruneT(G.floaters);

  // state transitions
  if (G.state === 'playing') {
    if (!G.cities.some(c => c.alive)) { G.overReason = 'cities'; setState('dying'); }
    else if (allTurretsDown()) startFinale();
    else if (!G.schedule.length && !G.enemies.length && !G.bombers.length && !G.drones.length && !G.shots.length && !G.explosions.length) {
      if (G.build && G.build.phase === 'active') finishBuild();
      const alive = G.cities.filter(c => c.alive).length;
      const ammoLeft = G.turrets.reduce((a, t) => a + (t.unlocked ? t.ammo : 0), 0);
      G.bonus = { alive, ammoLeft, cityPts: alive * 500, ammoPts: ammoLeft * 50, money: alive * 40 + ammoLeft * 5 + 50 + G.wave * 10 };
      G.score += G.bonus.cityPts + G.bonus.ammoPts;
      G.bonus.money = Math.round(G.bonus.money * DF().bonusMoney);
      G.money += G.bonus.money;
      // rebuild charges: +1 after every 6 waves cleared, max 3 stored (extra is lost)
      if (G.wave % 6 === 0) {
        if (G.rebuildCharges < REBUILD_MAX) { G.rebuildCharges++; G.bonus.charge = 'gained'; G.floaters.push({ x: (PL + PR) / 2, y: GROUND * 0.62, text: '+1 REBUILD CHARGE (' + G.rebuildCharges + '/' + REBUILD_MAX + ')', t: 3, c: '#8fe08a' }); }
        else { G.bonus.charge = 'lost'; G.floaters.push({ x: (PL + PR) / 2, y: GROUND * 0.62, text: 'REBUILD CHARGES FULL (3/3)', t: 3, c: '#ffb347' }); }
      }
      G.crates.length = 0; G.crateTimes.length = 0; // crates never hold up or outlive a wave
      saveHi();
      setState('waveEnd');
    }
  } else if (G.state === 'finale') {
    updateFinale(dt);
  } else if (G.state === 'waveEnd') {
    if (G.stateT > 3.2) setState('shop');
  } else if (G.state === 'dying') {
    if (G.stateT > 2.5) { saveHi(); setState('gameover'); lbOnGameOver(); SFX.over(); }
  }
}

// ---------- v2.0: "defenses down" finale ----------
// Every unlocked turret destroyed at once during a wave = game over even with cities standing:
// input is locked, a barrage aimed at every standing city (and any Builder Crew site) rains down,

const allTurretsDown = () => { const u = G.turrets.filter(t => t.unlocked); return u.length > 0 && u.every(t => !t.alive); };
function startFinale() {
  setState('finale');

  G.schedule.length = 0; G.crates.length = 0; G.crateTimes.length = 0; G.banner = 0;
  G.drag = null; G.markers.length = 0;
  const q = [];
  const standing = G.cities.filter(c => c.alive);
  // order the cities randomly so the strikes walk across the skyline unpredictably
  const order = standing.slice().sort(() => Math.random() - 0.5);
  const span = 2.6, n = order.length;
  order.forEach((c, i) => {
    const t0 = 0.7 + (n > 1 ? i * span / (n - 1) * 0.75 : 0);
    q.push({ t: t0, city: c, main: true });
    q.push({ t: t0 + rand(0.2, 0.45), city: c });
    if (Math.random() < 0.6) q.push({ t: t0 + rand(0.5, 0.8), city: c });

  // extra warheads between and around the cities so the sky really fills up

  q.sort((a, b) => a.t - b.t);

  G.shake = Math.max(G.shake, 6);
}
function spawnFinaleMissile(e) {
  let tx = e.x, city = null;

  const w = PR - PL, x = clamp(tx + rand(-0.32, 0.32) * w, PL + 10, PR - 10), y = hudWorld() - 20;
  const ty = GROUND - 2, dur = rand(1.0, 1.35) * (e.main ? 1 : 0.9);
  G.enemies.push({ type: Math.random() < 0.5 ? 'fast' : 'normal', finale: true, city, build: !!e.build,

}
function finaleImpact(m) {
  const x = m.x, big = !!m.city;
  explode(x, m.ty, (big ? 48 : 30) * Math.max(gs, 0.8), 'enemy', 0);
  for (let i = 0; i < (big ? 18 : 6); i++) addP(x + rand(-10, 10), GROUND - 4, rand(-60, 60), rand(-150, -40), rand(1.2, 2.2), 2.2, 'smoke', rand(5, 10), -6);
  const c = m.city;
  if (c && c.alive) {
    if (c.shield) shieldAbsorb(c.x, GROUND - cityDomeRy() * 0.8, { kind: 'city', city: c, cx: c.x, rx: cityDomeRx(), ry: cityDomeRy() });   // flashes and breaks, no save
    destroyCity(c);
    G.flash = Math.max(G.flash, 0.22);
    G.quake = { t: 0, dur: 0.9, seed: Math.random() * 10 };
  }
  if (G.build && G.build.phase === 'active' && (m.build || Math.abs(x - G.build.x) < 40 * gs)) failBuild();
  G.shake = Math.max(G.shake, big ? 18 : 10);
  if (big) SFX.impact(sfxPan(x)); else SFX.blast(sfxPan(x));
}
function updateFinale(dt) {
  const F = G.finale; if (!F) return;
  F.t += dt;
  while (F.queue.length && F.queue[0].t <= F.t) { spawnFinaleMissile(F.queue.shift()); F.spawned++; }
  // safety net (e.g. a resize mid-barrage): nothing may survive the finale
  if (F.t > 5.2) {
    for (const c of G.cities) if (c.alive) { if (c.shield) c.shield = null; explode(c.x, GROUND - 4, 44 * Math.max(gs, 0.8), 'enemy', 0); destroyCity(c); }
    if (G.build && G.build.phase === 'active') failBuild();
  }
  const pending = F.queue.length || G.enemies.some(m => m.finale && !m.dead);
  if (!G.cities.some(c => c.alive) && (!pending || F.t > 5.2) && F.t > 3.4) {
    setState('dying'); G.stateT = 1.0;   // ~1.5 s of burning skyline before the game over screen
  }
}

function saveHi() {
  const d = curDiff();
  if (G.score > hiScores[d]) { hiScores[d] = G.score; try { localStorage.setItem(hsKey(d), String(G.score)); } catch (e) {} }
}

// city dome: half-ellipse wide enough for the skyline, never reaching the neighbouring city
const cityDomeRx = () => 44 * gs, cityDomeRy = () => 70 * gs;
// returns the dome (turret or city) containing the point, or null
function inShield(x, y) {
  if (y > GROUND + 2) return null;
  if (G.shield) {
    const ct = G.turrets[1];
    if (ct && ct.unlocked && ct.alive && dist2(x, y, ct.x, GROUND) < shieldR() * shieldR()) return { kind: 'turret', cx: ct.x, rx: shieldR(), ry: shieldR() };
  }
  const rx = cityDomeRx(), ry = cityDomeRy();
  for (const c of G.cities) {
    if (!c.alive || !c.shield) continue;
    const dx = (x - c.x) / rx, dy = (y - GROUND) / ry;
    if (dx * dx + dy * dy < 1) return { kind: 'city', city: c, cx: c.x, rx, ry };
  }

}
function shieldAbsorb(x, y, sh) {
  sh = sh || inShield(x, y);

  else { sh.city.shield = null; G.cityShieldBlocks = (G.cityShieldBlocks || 0) + 1; }
  // flash at the dome surface
  const a = Math.atan2((y - GROUND) / sh.ry, (x - sh.cx) / sh.rx);
  const hx = sh.cx + Math.cos(a) * sh.rx, hy = GROUND + Math.min(0, Math.sin(a)) * sh.ry;
  G.explosions.push({ x: hx, y: hy, r: 2, maxR: 30 * Math.max(gs, 0.7), t: 0, life: 0.6, owner: 'shield', chain: 0 });
  for (let i = 0; i < 40; i++) {
    const aa = Math.PI + Math.random() * Math.PI;
    addP(sh.cx + Math.cos(aa) * sh.rx, GROUND + Math.sin(aa) * sh.ry, Math.cos(aa) * rand(30, 140), Math.sin(aa) * rand(30, 140), rand(0.4, 0.9), 0.9, i % 2 ? '#9fe6ff' : '#ffffff', 2, 120);
  }
  G.shake = Math.max(G.shake, 8);
  G.floaters.push({ x: sh.cx, y: GROUND - sh.ry - 14 * gs, text: 'SHIELD DOWN', t: 2, c: '#9fe6ff' });
  SFX.shield();
}
function finishBuild() {
  const b = G.build, c = G.cities[b.cityIdx];
  b.progress = 1;
  Object.assign(c, b.template, { alive: true }); c.x = posX(c.fx);
  b.phase = 'done';
  G.floaters.push({ x: c.x, y: GROUND - 70, text: 'CITY REBUILT', t: 2.5, c: '#8fe08a' });
  for (let i = 0; i < 24; i++) addP(c.x + rand(-30, 30), GROUND - rand(0, 40), rand(-40, 40), rand(-90, -30), 1, 1, i % 2 ? '#8fe08a' : '#ffe066', 2.5, 60);
  SFX.wave();
}
function failBuild() {
  const b = G.build;
  b.phase = 'failed';
  for (const w of b.workers) {
    for (let i = 0; i < 10; i++) addP(w.x, GROUND - 6, rand(-90, 90), rand(-160, -40), 0.9, 0.9, i % 3 ? '#ff9a3c' : '#ffd400', 2.2, 380);
  }
  G.floaters.push({ x: b.x, y: GROUND - 80, text: 'REBUILD FAILED', t: 2.5, c: '#ff4d4d' });
  SFX.deny();
}
function impact(x, y) {
  if (G.shield && G.turrets[1].alive && Math.abs(x - G.turrets[1].x) < 26 * gs) { shieldAbsorb(x, y, { kind: 'turret', cx: G.turrets[1].x, rx: shieldR(), ry: shieldR() }); return; }
  // safety net: a ground hit right on a shielded city is absorbed too
  { const sc = G.cities.find(c => c.alive && c.shield && Math.abs(c.x - x) < 36 * gs); if (sc) { shieldAbsorb(x, y, { kind: 'city', city: sc, cx: sc.x, rx: cityDomeRx(), ry: cityDomeRy() }); return; } }

    if (c.alive && Math.abs(c.x - x) < 36 * gs) {
      c.alive = false;
      for (let i = 0; i < 30; i++) addP(c.x + rand(-30, 30) * gs, GROUND - rand(0, 40) * gs, rand(-120, 120), rand(-220, -40), rand(0.8, 1.6), 1.6, Math.random() < 0.5 ? '#3a3f55' : '#ff9a3c', rand(2, 4), 400);
      G.shake = 16;
      G.floaters.push({ x: c.x, y: GROUND - 60, text: 'CITY LOST', t: 1.4, c: '#ff4d4d' });
    }
  }
  for (const t of G.turrets) {
    if (t.unlocked && t.alive && Math.abs(t.x - x) < 26 * gs) {
      t.alive = false; t.ammo = 0;
      G.floaters.push({ x: t.x, y: GROUND - 50, text: 'TURRET DOWN', t: 1.4, c: '#ff4d4d' });
    }

// particles are pooled: dead ones are recycled by addP instead of becoming garbage every frame
const P_POOL = [];
function addP(x, y, vx, vy, life, max, c, s, g) {
  const p = P_POOL.pop() || {};
  p.x = x; p.y = y; p.vx = vx; p.vy = vy; p.life = life; p.max = max; p.c = c; p.s = s; p.g = g; p._k = 0;
  G.particles.push(p); return p;
}
function pruneDead(a) { let j = 0; for (let i = 0; i < a.length; i++) { const v = a[i]; if (!v.dead) a[j++] = v; } a.length = j; }

// wrecked turrets smoke (was emitted from the renderer, so the rate scaled with display refresh rate)
function turretSmoke(dt) {
  const pr = Math.min(1, 18 * dt);   // ~0.3 per frame at 60 fps, as before
  for (const t of G.turrets)
    if (!t.alive && t.unlocked && Math.random() < pr) addP(t.x + rand(-8, 8) * gs, GROUND - 18 * gs, rand(-5, 5), -30, 1.5, 1.5, 'smoke', 4, -4);
}
function updateParticles(dt) {
  const pm = PARTICLE_MULT[SET.particles] ?? 1, ps = G.particles, damp = 1 - dt * 1.5;
  if (pm < 1) for (const q of ps) if (!q._k) { q._k = 1; if (Math.random() > pm) q.life = 0; }
  // integrate + in-place compaction (no new array per frame)
  let j = 0;
  for (let i = 0; i < ps.length; i++) {
    const p = ps[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * dt; p.vx *= damp; p.life -= dt;
    if (p.life > 0) ps[j++] = p; else if (P_POOL.length < 1200) P_POOL.push(p);
  }
  ps.length = j;
  const cap = Math.round(900 * pm);
  if (ps.length > cap) { const n = ps.length - cap; for (let i = 0; i < n && P_POOL.length < 1200; i++) P_POOL.push(ps[i]); ps.splice(0, n); }
}

// ---------- rendering: world layer (world units, transform dpr*k) ----------
const FONT = '"Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif';

const HQ = () => SET.gfx === 1;
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };

}

function drawWaveEnd() {

function wrap(s, maxW, size) {
  ctx.font = 'normal ' + size + 'px ' + FONT;
  const words = s.split(' '), lines = [''];
  for (const wd of words) { const t = lines[lines.length - 1] ? lines[lines.length - 1] + ' ' + wd : wd; if (ctx.measureText(t).width > maxW && lines[lines.length - 1]) lines.push(wd); else lines[lines.length - 1] = t; }
  return lines;
}
function drawShop() {

  });

    const g2 = ctx.createLinearGradient(0, A.y + A.h - 18, 0, A.y + A.h); g2.addColorStop(0, 'rgba(5,2,8,0)'); g2.addColorStop(1, 'rgba(5,2,8,0.9)');

function drawDefensesDown() {

  ctx.fillStyle = g; ctx.fillRect(0, by - fs, cssW, fs * 2.4);

function drawGameOver() {
  ctx.fillStyle = 'rgba(20,0,0,0.65)'; ctx.fillRect(0, 0, cssW, cssH);
  const o = ov(), b = box();

  const sizes = [hS2, fsz(20, o, 15), fsz(26, o, 20), fsz(18, o, 14), fsz(22, o, 17), fsz(22, o, 17)];

  const L = G.lb, form = lbFormOn(), panelOn = !!(L && L.mode !== 'hidden');

  const top = safe.t + UI.bs + 12, avail = b.B - top;

  if (totalOf() > avail) gap = Math.max(5, gap - (totalOf() - avail) / 7);

  line('THE CITIES HAVE FALLEN', 0, '#ff3b2f');

  line('Score: ' + G.score, 2, '#fff');

  const best = G.score >= hiScores[curDiff()] && G.score > 0;

    const msgCol = L.mode === 'done' ? '#8fe08a' : (L.mode === 'error' || (L.mode === 'note' && /Couldn|Try again/.test(L.msg))) ? '#ffb3a0' : '#ccc';
    if (form) {
      txt('SAVE YOUR SCORE TO THE ARCADE LEADERBOARD', b.cx, py + pad + pS * 0.55, pS, '#ffe066', 'center', 'bold', pw - 2 * pad);
      const ry = py + pad + pS * 1.5, bw2 = narrowP ? (pw - 2 * pad - pg) / 2 : Math.min(130, (pw - 2 * pad) * 0.24);
      const field = narrowP ? { x: px + pad, y: ry, w: pw - 2 * pad, h: fh } : { x: px + pad, y: ry, w: pw - 2 * pad - 2 * bw2 - 2 * pg, h: fh };
      const by = narrowP ? ry + fh + pg : ry, bx = narrowP ? px + pad : field.x + field.w + pg;
      GO.lb.field = field;
      GO.lb.submit = { x: bx, y: by, w: bw2, h: fh };
      GO.lb.skip = { x: bx + bw2 + pg, y: by, w: bw2, h: fh };

      ctx.fillStyle = 'rgba(5,2,10,0.85)'; rrect(field.x, field.y, field.w, field.h, 8); ctx.fill();
      ctx.strokeStyle = foc ? '#ffb3a0' : 'rgba(255,200,180,0.5)'; ctx.lineWidth = foc ? 2.5 : 1.5; rrect(field.x + 0.75, field.y + 0.75, field.w - 1.5, field.h - 1.5, 8); ctx.stroke();
      drawMenuBtn(GO.lb.submit, L.mode === 'sending' ? 'SAVING...' : 'SUBMIT', true);
      drawMenuBtn(GO.lb.skip, 'SKIP', false);
      const hint = L.msg || (isTouch ? 'Optional - tap the box to type a name (up to 12).' : 'Optional - click the box or press Tab, type a name, Enter to save.');
      txt(hint, b.cx, by + fh + pS * 0.95, pS, L.msg ? msgCol : '#bbb', 'center', 'normal', pw - 2 * pad);
    } else {
      txt(L.msg, b.cx, py + panelH / 2, pS, msgCol, 'center', L.mode === 'done' ? 'bold' : 'normal', pw - 2 * pad);

  if (G.stateT > 1 && Math.sin(G.time * 4) > -0.3) txt(isTouch ? 'Tap to play again' : 'Click or tap to play again', b.cx, y + sizes[5] / 2, sizes[5], '#fff', 'center', 'bold', b.w);
  y += sizes[5] + gap;
  // button back to the title to pick another difficulty
  const bw = Math.min(b.w, 300);
  GO.btn = { x: b.cx - bw / 2, y: Math.min(y, b.B - bh - 4), w: bw, h: bh };
  drawMenuBtn(GO.btn, 'CHANGE DIFFICULTY', false);
  drawButtons(false);
}

// whole-screen quake offset in CSS px: strong decaying jolt + low-frequency rumble wobble
function quakeOffset() {
  const q = G.quake; if (!q || G.state === 'paused') return { x: 0, y: 0 };
  if (SET.shake <= 0) return { x: 0, y: 0 };
  const e = 1 - q.t / q.dur, A = clamp(Math.min(cssW, cssH) * 0.035, 10, 30) * shakeK();
  const jolt = A * e * e * e, wob = A * 0.45 * e;
  return {
    x: rand(-1, 1) * jolt + Math.sin(q.t * 9 + q.seed) * wob,
    y: rand(-1, 1) * jolt * 0.9 + Math.sin(q.t * 6.3 + q.seed * 2) * wob,
  };
}
function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (!SCN.comp || SCN.key !== sceneKey()) { ctx.fillStyle = '#07040f'; ctx.fillRect(0, 0, canvas.width, canvas.height); }   // the opaque scene composite covers the canvas (with a margin for shake)
  let sx = 0, sy = 0;
  if (G.shake > 0 && G.state !== 'paused' && SET.shake > 0) { const sk = G.shake * shakeK(); sx = rand(-sk, sk) * 0.6; sy = rand(-sk, sk) * 0.6; }
  const s = dpr * k, q = quakeOffset();
  ctx.setTransform(s, 0, 0, s, sx * s + q.x * dpr, sy * s + q.y * dpr);
  drawBackground();
  drawFireworks();   // behind cities and every threat
  if (G.state !== 'title') drawBannerPlane();
  const cityList = G.state === 'title' ? titleCities : G.cities;
  drawCityReflections(cityList);
  groundLightPools();
  if (HQ() && G.state !== 'title') drawGroundShadows();
  cityList.forEach(drawCity);
  if (G.state !== 'title') { drawBuild(); G.turrets.forEach(drawTurret); drawAuto(); }
  drawFogBase();
  if (G.state !== 'title') drawShield();
  drawShots();
  drawCrates();
  drawEnemies();
  drawDrones();
  drawNukes();
  drawParticles();
  drawExplosions();
  // UI in CSS pixels (shares the whole-screen quake offset)
  ctx.setTransform(dpr, 0, 0, dpr, q.x * dpr, q.y * dpr);
  if (G.flash > 0) { ctx.fillStyle = 'rgba(255,250,235,' + Math.min(1, G.flash * 1.1) + ')'; ctx.fillRect(-60, -60, cssW + 120, cssH + 120); }
  if (G.state === 'title') drawTitle();
  else {
    if (G.state !== 'shop') { drawFloaters(); drawHUD(); }
    if (G.banner > 0 && G.state === 'playing') {
      const o = ov(), b = box();
      ctx.globalAlpha = clamp(G.banner, 0, 1);
      const by = safe.t + UI.hudH + (cssH - safe.t - UI.hudH - safe.b) * 0.3;
      txt('WAVE ' + G.wave, b.cx, by, fsz(56, o, 36), '#ffb3a0', 'center', 'bold', b.w);
      txt(G.wave === 1 ? 'Protect the cities!' : waveHint(), b.cx, by + fsz(46, o, 34), fsz(18, o, 14), '#fff', 'center', 'normal', b.w);
      ctx.globalAlpha = 1;
    }
    if (G.state === 'finale' || (G.state === 'dying' && G.overReason === 'turrets')) drawDefensesDown();
    if (G.state === 'paused') drawPause();
    if (G.state === 'waveEnd') drawWaveEnd();
    if (G.state === 'shop') drawShop();
    if (G.state === 'gameover') drawGameOver();
  }
  if (G.helpOpen && G.state !== 'title' && G.state !== 'paused') G.helpOpen = false;
  if (G.optOpen && G.state !== 'title' && G.state !== 'paused') G.optOpen = false;
  if (G.wnOpen && G.state !== 'title' && G.state !== 'paused') G.wnOpen = false;
  drawHelp();
  drawWhatsNew();
  drawOptions();
  drawCrosshair();
}
function waveHint() {
  if (G.wave === 3) return 'New threat: fast warheads (orange trails)';
  if (G.wave === 5) return 'New threat: splitting warheads (pink) - hit them early';
  if (G.wave === 6) return 'New threat: bombers drop warheads as they cross';
  if (G.wave === 7) return 'New threat: kamikaze drone - it dives after a red blink!';
  if (G.wave === 11) return 'Stealth bombers inbound - shoot down their nukes!';
  return 'Hold the line';
}

// title-screen demo
let demoT = 0;
function titleDemo(dt) {
  demoT -= dt;
  if (demoT <= 0) {
    demoT = rand(0.4, 1.1) * clamp(960 / (PR - PL), 0.8, 1.6);
    const x = rand(PL + 20, PR - 20), tx = rand(PL + 40, PR - 40), ty = GROUND - 6 * gs;
    const d = Math.hypot(tx - x, ty + 10), sp = 70 * vS;
    G.enemies.push({ type: 'normal', x0: x, y0: -10, x, y: -10, tx, ty, vx: (tx - x) / d * sp, vy: (ty + 10) / d * sp, splitY: 1e9, demo: true });
  }
  for (const m of G.enemies) {
    m.x += m.vx * dt; m.y += m.vy * dt;
    if (m.y > GROUND * rand(0.36, 0.86) && Math.random() < 0.02) { m.dead = true; explode(m.x, m.y, 30 * blastScale(), 'demo', 0); }
    if (m.y >= m.ty) m.dead = true;
  }
  for (const e of G.explosions) { e.t += dt; const p = e.t / e.life; e.r = p < 0.35 ? e.maxR * Math.sin(p / 0.35 * Math.PI / 2) : p < 0.65 ? e.maxR : e.maxR * (1 - (p - 0.65) / 0.35); if (p >= 1) e.dead = true; }
  pruneDead(G.enemies); pruneDead(G.explosions);
}

// ---------- init + live re-layout ----------
layout();
applyOptions();
titleCities = CITY_F.map(makeCity);
// resize / rotation / fullscreen / visualViewport events can fire in bursts: they only mark the layout
// dirty and the next frame re-lays out once (devicePixelRatio changes - e.g. dragging the window to
// another monitor - are caught by the same per-frame check)
let layoutDirty = false;
const relayout = () => { layoutDirty = true; };
window.addEventListener('resize', relayout);
['fullscreenchange', 'webkitfullscreenchange'].forEach(ev => document.addEventListener(ev, () => { relayout(); setTimeout(relayout, 120); setTimeout(relayout, 400); }));
window.addEventListener('orientationchange', () => { relayout(); setTimeout(relayout, 250); });
if (window.visualViewport) window.visualViewport.addEventListener('resize', relayout);

// ---------- main loop ----------
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.05) dt = 0.05;   // tab switches / long stalls never produce a simulation jump
  if (dt < 0) dt = 0;
  if (document.hidden) return;   // some embedded browsers keep firing rAF in the background: do nothing
  // v2.2.4: real time a run is on screen (not paused, not hidden) - the leaderboard's played time
  const st = G.state;
  if (st === 'playing' || st === 'waveEnd' || st === 'shop' || st === 'finale' || st === 'dying') G.runMs = (G.runMs || 0) + Math.min(250, Math.max(0, now - (G._lastNow || now)));
  G._lastNow = now;
  try {
    // re-layout when marked dirty, or on any size / pixel-ratio change the events missed (some in-app browsers)
    const vsz = viewSize();
    if (layoutDirty || vsz.w !== cssW || vsz.h !== cssH || Math.min(window.devicePixelRatio || 1, 2) !== dpr) { layoutDirty = false; layout(); }
    if (G.state === 'title') { G.time += dt; titleDemo(dt); updateParticles(dt); }
    else {
      const steps = G._timeScale || 1;   // test hook: extra fixed sub-steps (default 1 = normal speed)
      for (let i = 0; i < steps; i++) { update(dt); if (G._onTick) G._onTick(dt); }
    }
    const rt0 = performance.now();
    render();
    syncArcadeA11y(); syncLbInput();
    G._renderMs = (G._renderMs || 0) * 0.9 + (performance.now() - rt0) * 0.1;   // diagnostics: smoothed render cost
    musicUpdate();
  } catch (err) { console.error(err); }
}
requestAnimationFrame(frame);
})();
