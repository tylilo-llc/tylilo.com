<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Starbase Defender</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;font-family:monospace}canvas{display:block}
#tc{position:fixed;inset:0;pointer-events:none;display:none}
.tb{position:absolute;pointer-events:auto;background:rgba(80,160,255,.18);border:1px solid #4af;color:#9cf;border-radius:10px;font:bold 14px monospace;display:flex;align-items:center;justify-content:center;user-select:none}
#thr{position:fixed;right:calc(10px + env(safe-area-inset-right));bottom:calc(70px + env(safe-area-inset-bottom));width:58px;height:300px;display:none;touch-action:none;user-select:none;cursor:ns-resize;background:rgba(80,160,255,.12);border:1px solid #4af;border-radius:12px;z-index:5}

</style></head><body><canvas id="c"></canvas><div id="tc"></div><div id="thr"><div class="ti">THROTTLE</div><div id="thk">0</div></div>
<script>
"use strict";
const VERSION='1.5.0';
// enemy types: hp range, move speed mult, fire-rate mult, shots per burst, shield energy per hit, system-damage chance mult, points, hit radius, size
const TY={F:{n:'FIGHTER',hp:[1,1],spd:1,fire:1,burst:1,en:150,sys:1,pts:100,rad:9,sz:5,col:'#f55'},
 C:{n:'CRUISER',hp:[3,4],spd:.55,fire:.8,burst:1,en:200,sys:1,pts:250,rad:11,sz:7,col:'#fa3'},
 G:{n:'GUNSHIP',hp:[1,2],spd:1.15,fire:1.6,burst:3,en:320,sys:2,pts:300,rad:9,sz:5,col:'#f4f'},
 B:{n:'BASESTAR',hp:[12,12],spd:.3,fire:1.5,burst:4,en:450,sys:2.5,pts:1200,rad:22,sz:14,col:'#4f6'}};
// type mix weights per difficulty [F,C,G], basestar chance per spawned group
const MIX=[[.75,.18,.07,.04],[.6,.25,.15,.07],[.45,.3,.25,.1],[.35,.3,.35,.14]];
function genTypes(k){const m=MIX[diff],a=[];for(let i=0;i<k;i++){const r=Math.random();a.push(r<m[0]?'F':r<m[0]+m[1]?'C':'G')}if(k>0&&Math.random()<m[3]&&!(S&&S.boss>=2)){a[0]='B';if(S)S.boss=(S.boss||0)+1}return a}
const CHANGES=[['1.5.0','Enemy types: fighter, cruiser, gunship, basestar boss'],['1.4.0','Version number shown on title, help and HUD; in-game changelog'],['1.3.0','Renamed to STARBASE DEFENDER'],['1.2.0','Throttle slider, top-row buttons, multi-touch'],['1.1.0','Floating joystick, response curve, smoothing, aim assist, tilt steering'],['1.0.0','Original release: cockpit, chart, hyperwarp, docking, damage, ranks']];
const cv=document.getElementById('c'),g=cv.getContext('2d');let W,H;
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight}addEventListener('resize',rs);rs();
const GW=8,GH=4,rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>v<a?a:v>b?b:v;
const DIFF=[{n:'NOVICE',e:12,fire:0.25,move:45,acc:.15,dmg:.15},{n:'PILOT',e:18,fire:.45,move:35,acc:.25,dmg:.25},{n:'WARRIOR',e:24,fire:.7,move:26,acc:.35,dmg:.35},{n:'COMMANDER',e:30,fire:1,move:20,acc:.45,dmg:.45}];
let assist=true,tilt=false,tiltV={x:0,y:0},tilt0=null,stick=null,sm={x:0,y:0};const curve=v=>{const a=Math.abs(v);return a<.06?0:Math.sign(v)*(.35*a+.65*a*a*a)};
let diff=1,state='title',help=false,paused=false,S=null,msg='',msgT=0;
// ---------- audio ----------
let AC=null;function au(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume()}
function tone(f,d,type='square',v=.1,f2){if(!AC)return;const o=AC.createOscillator(),q=AC.createGain(),t=AC.currentTime;o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);q.gain.setValueAtTime(v,t);q.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(q).connect(AC.destination);o.start(t);o.stop(t+d)}
function noise(d,v=.3){if(!AC)return;const n=AC.sampleRate*d,b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);const s=AC.createBufferSource(),q=AC.createGain(),fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=900;s.buffer=b;q.gain.value=v;s.connect(fl).connect(q).connect(AC.destination);s.start()}
const sfx={fire:()=>tone(900,.25,'sawtooth',.08,120),boom:()=>noise(.7,.4),hit:()=>{noise(.3,.3);tone(120,.3,'square',.1,40)},beep:()=>tone(660,.08),alert:()=>{tone(440,.15);setTimeout(()=>tone(330,.2),160)},warp:()=>tone(80,2,'sawtooth',.08,1600),dock:()=>{tone(523,.15,'triangle');setTimeout(()=>tone(784,.3,'triangle'),160)},eshot:()=>tone(300,.2,'triangle',.05,900)};
// ---------- game setup ----------
function newGame(){const D=DIFF[diff];const sec=[];for(let y=0;y<GH;y++)for(let x=0;x<GW;x++)sec.push({x,y,e:0,base:false});
 const bases=[];while(bases.length<4){const s=sec[(Math.random()*sec.length)|0];if(!s.base&&s.x>0&&s.x<GW-1){s.base=true;bases.push(s)}}
 let left=D.e;while(left>0){const s=sec[(Math.random()*sec.length)|0];if(s.base||s.e>=4)continue;const k=Math.min(left,1+(Math.random()*3|0),4-s.e);s.e+=k;left-=k}
 S=null;for(const s of sec)s.types=genTypes(s.e);if(!sec.some(s=>s.types.includes('B'))){const s=sec.filter(s=>s.e>0)[0];s.types[0]='B'}
 let start=sec.find(s=>s.base);
 S={sec,cur:start,cx:start.x,cy:start.y,energy:7000,speed:0,shield:false,aft:false,comp:true,kills:0,total:D.e,time:0,gtimer:0,stars:[],obj:[],torps:[],eshots:[],booms:[],dmg:{P:0,E:0,S:0,C:0,L:0},flash:0,tcool:0,dock:0,warp:0,basesLost:0,shake:0,hitsTaken:0,eused:0};
 for(let i=0;i<220;i++)S.stars.push(newStar(true));enterSector();state='play';say('MISSION START - '+D.n,3)}
function newStar(any){return{x:rnd(-400,400),y:rnd(-400,400),z:any?rnd(-400,400):rnd(300,400)}}
function say(m,t=2.5){msg=m;msgT=t}
function enterSector(){S.obj=[];S.torps=[];S.eshots=[];const s=S.cur;S.cur=s;
 if(!s.types)s.types=[];while(s.types.length<s.e)s.types.push(...genTypes(1));s.types.length=s.e;
 for(const ty of s.types)S.obj.push(mkEnemy(ty));
 if(s.base)S.obj.push({t:'b',x:rnd(-30,30),y:rnd(-20,20),z:120});
 if(s.e)sfx.alert(),say('RED ALERT: '+s.e+' ZYLON'+(s.e>1?'S':'')+' IN SECTOR');else if(s.base)say('STARBASE IN SECTOR - APPROACH AT SPEED 0 TO DOCK')}
function mkEnemy(ty){const T=TY[ty],hp=T.hp[0]+(Math.random()*(T.hp[1]-T.hp[0]+1)|0);return{t:'z',ty,hp,mhp:hp,hitT:0,bq:0,x:rnd(-150,150),y:rnd(-80,80),z:rnd(150,350)*(Math.random()<.25?-1:1),vx:0,vy:0,vz:0,ai:0,ft:rnd(1,4)}}
function sector(x,y){return S.sec[y*GW+x]}
// ---------- input ----------
const K={};let mouse={down:false,x:0,y:0},touchSteer={x:0,y:0};
addEventListener('keydown',e=>{au();const k=e.key.toLowerCase();if([' ','arrowup','arrowdown','arrowleft','arrowright','tab'].includes(k))e.preventDefault();if(K[k])return;K[k]=true;press(k)});
addEventListener('keyup',e=>{K[e.key.toLowerCase()]=false});
cv.addEventListener('mousedown',e=>{au();if(e.button===2){press(' ');return}mouse.down=true;mouse.x=e.clientX;mouse.y=e.clientY;if(state!=='play')clickAt(e.clientX,e.clientY)});
addEventListener('mouseup',()=>mouse.down=false);addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});
cv.addEventListener('contextmenu',e=>e.preventDefault());
let chartSel={x:0,y:0};
function press(k){
 if(k==='?'||k==='/'){help=!help;return}
 if(state==='title'){if('1234'.includes(k))diff=+k-1;if(k==='enter'||k===' ')newGame();return}
 if(state==='end'){if(k==='enter'||k===' ')state='title';return}
 if(k==='p'){paused=!paused;return}if(k==='escape'){if(state==='chart')state='play';else paused=!paused;return}
 if(paused||state==='warp')return;
 if(k==='g'){if(state==='chart')state='play';else{state='chart';chartSel={x:S.cur.x,y:S.cur.y};if(S.dmg.L)say('GALACTIC CHART DAMAGED - DATA UNRELIABLE')}sfx.beep();return}
 if(k==='h'){if(state==='chart')startWarp();else{state='chart';chartSel={x:S.cur.x,y:S.cur.y};say('SELECT TARGET SECTOR, PRESS H TO WARP')}return}
 if(state==='chart'){const d={arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0],arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1]}[k];if(d){chartSel.x=clamp(chartSel.x+d[0],0,GW-1);chartSel.y=clamp(chartSel.y+d[1],0,GH-1);sfx.beep()}if(k==='enter')startWarp();return}
 if(k>='0'&&k<='9'){let v=+k;if(S.dmg.E&&v>5){v=5;say('ENGINES DAMAGED - MAX SPEED 5')}S.speed=v;sfx.beep()}
 if(k===' ')fire();
 if(k==='t'){if(S.dmg.S&&!S.shield){say('SHIELDS DESTROYED - DOCK FOR REPAIR');return}S.shield=!S.shield;sfx.beep();say('SHIELDS '+(S.shield?'ON':'OFF'),1.2)}
 if(k==='v'){S.aft=!S.aft;sfx.beep()}if(k==='f'){S.aft=false}if(k==='b'){S.aft=true}
 if(k==='x'){assist=!assist;sfx.beep();say('AIM ASSIST '+(assist?'ON':'OFF'),1.2)}
 if(k==='c'){S.comp=!S.comp;sfx.beep()}
}
function clickAt(x,y){if(state==='title'){newGame();return}if(state==='end'){state='title';return}
 if(state==='chart'){const L=chartLayout();const cx=Math.floor((x-L.x)/L.cw),cy=Math.floor((y-L.y)/L.ch);if(cx>=0&&cx<GW&&cy>=0&&cy<GH){if(chartSel.x===cx&&chartSel.y===cy)startWarp();else{chartSel={x:cx,y:cy};sfx.beep()}}}}
function warpCost(){const d=Math.hypot(chartSel.x-S.cur.x,chartSel.y-S.cur.y);return Math.round(100+d*120)}
function startWarp(){if(chartSel.x===S.cur.x&&chartSel.y===S.cur.y){state='play';return}const c=warpCost();S.energy-=c;S.eused+=c;S.warp=2.2;S.warpTo=sector(chartSel.x,chartSel.y);state='warp';sfx.warp()}
function fire(){if(S.tcool>0||state!=='play')return;if(S.dmg.P&&Math.random()<.5){say('PHOTONS DAMAGED - MISFIRE',1);S.tcool=.4;return}
 const dir=S.aft?-1:1;const side=(S.torps.length%2?1:-1)*3;S.torps.push({x:side,y:-2,z:dir*4,vz:dir*(140+S.speed*8),life:2.2});S.energy-=10;S.eused+=10;S.tcool=.35;sfx.fire()}
// ---------- update ----------
function rot(o,ya,pa){// rotate point around ship (yaw about Y, pitch about X)
 let c=Math.cos(ya),s=Math.sin(ya),x=o.x*c-o.z*s,z=o.x*s+o.z*c;o.x=x;o.z=z;c=Math.cos(pa);s=Math.sin(pa);const y=o.y*c-o.z*s;z=o.y*s+o.z*c;o.y=y;o.z=z}
function update(dt){S.time+=dt;if(msgT>0)msgT-=dt;S.flash=Math.max(0,S.flash-dt*2);S.tcool-=dt;S.shake=Math.max(0,S.shake-dt);
 if(state==='warp'){S.warp-=dt;if(S.warp<=0){S.cur=S.warpTo;S.speed=Math.min(S.speed,3);state='play';
   // warp drift error on harder levels
   enterSector();for(const st of S.stars){st.x=rnd(-400,400);st.y=rnd(-400,400);st.z=rnd(-400,400)}}}
 // energy
 const drain=(S.speed*S.speed*0.35+(S.shield?3:0)+(S.comp?0.5:0)+0.5)*dt;S.energy-=drain;S.eused+=drain;
 // galactic strategy
 S.gtimer+=dt;if(S.gtimer>DIFF[diff].move){S.gtimer=0;galaxyStep()}
 if(S.energy<=0){S.energy=0;return endGame('OUT OF ENERGY')}
 if(state!=='play'&&state!=='chart'&&state!=='warp')return;
 if(state==='warp')return;
 // steering
 let sx=0,sy=0;if(state==='play'){if(K.arrowleft||K.a)sx-=1;if(K.arrowright||K.d)sx+=1;if(K.arrowup||K.w)sy-=1;if(K.arrowdown||K.s)sy+=1;
  if(mouse.down){sx+=curve(clamp((mouse.x-W/2)/(W/3),-1,1));sy+=curve(clamp((mouse.y-H/2)/(H/3),-1,1))}
  sx+=curve(touchSteer.x)*.55;sy+=curve(touchSteer.y)*.55;if(tilt){sx+=curve(tiltV.x)*.55;sy+=curve(tiltV.y)*.55}
  sx=clamp(sx,-1,1);sy=clamp(sy,-1,1);
  if(assist){const t=target();if(t){const dx=t.x/t.z,dy=t.y/t.z,a=Math.hypot(dx,dy);if(a<.18&&a>.004){const af=S.aft?-1:1,k=.35*(1-a/.18);sx+=clamp(dx/.05,-1,1)*k*af;sy-=clamp(dy/.05,-1,1)*k*af}}}}
 const kk=Math.min(1,dt*7);sm.x+=(sx-sm.x)*kk;sm.y+=(sy-sm.y)*kk;sx=sm.x;sy=sm.y;
 const tr=1.1*dt,af=S.aft?-1:1;const ya=sx*tr*af,pa=-sy*tr; // arrow up = nose down (flight style)
 const mv=S.speed*S.speed*0.9*dt+S.speed*2*dt;
 const all=[...S.stars,...S.obj,...S.eshots,...S.booms];
 for(const o of all){rot(o,ya,pa);o.z-=mv}
 for(const st of S.stars){if(st.z<-400){Object.assign(st,newStar());st.z=400}else if(st.z>400){Object.assign(st,newStar());st.z=-400}if(Math.abs(st.x)>400)st.x=-Math.sign(st.x)*399;if(Math.abs(st.y)>400)st.y=-Math.sign(st.y)*399}
 for(const t of S.torps){t.z+=t.vz*dt;t.life-=dt;t.x*=.97;t.y*=.97}
 // enemies
 const D=DIFF[diff];
 for(const o of S.obj){if(o.t!=='z')continue;o.ai-=dt;if(o.ai<=0){o.ai=rnd(1,3);const tx=rnd(-40,40),ty=rnd(-30,30),tz=rnd(40,140)*(Math.random()<.3?-1:1);const d=Math.hypot(tx-o.x,ty-o.y,tz-o.z)||1,sp=(rnd(15,35)+diff*6)*TY[o.ty].spd;o.vx=(tx-o.x)/d*sp;o.vy=(ty-o.y)/d*sp;o.vz=(tz-o.z)/d*sp}
  o.x+=o.vx*dt;o.y+=o.vy*dt;o.z+=o.vz*dt;o.ft-=dt;
  const r=Math.hypot(o.x,o.y,o.z);if(r>600){o.x*=.5;o.y*=.5;o.z*=.5}
  o.hitT=Math.max(0,o.hitT-dt);if(o.ft<=0&&r<300){const T=TY[o.ty];if(o.bq>0){o.bq--;o.ft=.18}else{o.bq=T.burst-1;o.ft=rnd(2,4)/D.fire/T.fire}const sp=60+diff*15,e=(1-D.acc)*0.5;const dx=-o.x/r+rnd(-e,e),dy=-o.y/r+rnd(-e,e),dz=-o.z/r+rnd(-e,e);const n=Math.hypot(dx,dy,dz);S.eshots.push({x:o.x,y:o.y,z:o.z,vx:dx/n*sp,vy:dy/n*sp,vz:dz/n*sp,life:r/sp+1,ty:o.ty});sfx.eshot()}}
 for(const e of S.eshots){e.x+=e.vx*dt;e.y+=e.vy*dt;e.z+=e.vz*dt;e.life-=dt;if(Math.hypot(e.x,e.y,e.z)<6){e.life=0;playerHit(e.ty||'F')}}
 // torpedo hits
 for(const t of S.torps)for(const o of S.obj){if(o.t!=='z'||o.dead||t.life<=0)continue;if(Math.hypot(t.x-o.x,t.y-o.y,t.z-o.z)<TY[o.ty].rad){t.life=0;o.hp--;o.hitT=.18;if(o.hp<=0){o.dead=true;kill(o)}else{tone(200,.12,'square',.08,90);say(TY[o.ty].n+' HIT - '+o.hp+'/'+o.mhp,1)}}}
 for(const t of S.torps)for(const e of S.eshots)if(t.life>0&&Math.hypot(t.x-e.x,t.y-e.y,t.z-e.z)<5){t.life=0;e.life=0}
 for(const b of S.booms)b.life-=dt;
 S.obj=S.obj.filter(o=>!o.dead);S.torps=S.torps.filter(t=>t.life>0);S.eshots=S.eshots.filter(e=>e.life>0);S.booms=S.booms.filter(b=>b.life>0);
 // docking
 const base=S.obj.find(o=>o.t==='b');
 if(base){const r=Math.hypot(base.x,base.y,base.z);if(r<30&&S.speed===0&&base.z>0&&Math.abs(base.x)<15&&Math.abs(base.y)<15&&!S.obj.some(o=>o.t==='z')){S.dock+=dt;if(S.dock>2.5){S.dock=0;S.energy=7000;for(const k in S.dmg)S.dmg[k]=0;say('DOCKING COMPLETE - ENERGY RESTORED, SYSTEMS REPAIRED',3);sfx.dock();base.z=90}}else S.dock=0}
}
function kill(o){S.kills++;S.pts=(S.pts||0)+TY[o.ty].pts;S.killsBy=S.killsBy||{};S.killsBy[o.ty]=(S.killsBy[o.ty]||0)+1;const ix=S.cur.types.indexOf(o.ty);if(ix>=0)S.cur.types.splice(ix,1);S.cur.e=Math.max(0,S.cur.e-1);if(o.ty==='B')say('BASESTAR DESTROYED! +'+TY.B.pts,3);S.booms.push({x:o.x,y:o.y,z:o.z,life:1,parts:Array.from({length:o.ty==='B'?60:24},()=>[rnd(-1,1),rnd(-1,1),rnd(-1,1)])});sfx.boom();
 if(S.sec.every(s=>s.e===0))return endGame('ALL ZYLONS DESTROYED',true);if(S.cur.e===0)say('SECTOR CLEAR')}
function playerHit(ty){const T=TY[ty]||TY.F;S.hitsTaken++;S.shake=.4;sfx.hit();
 if(!S.shield){S.flash=1;return endGame('SHIP DESTROYED - SHIELDS WERE DOWN')}
 S.flash=.6;S.energy-=T.en;S.eused+=T.en;
 if(Math.random()<Math.min(.95,DIFF[diff].dmg*T.sys)){const ks=Object.keys(S.dmg).filter(k=>!S.dmg[k]);if(ks.length){const k=ks[(Math.random()*ks.length)|0];S.dmg[k]=1;say({P:'PHOTON TORPEDOES',E:'ENGINES',S:'SHIELDS',C:'ATTACK COMPUTER',L:'GALACTIC CHART'}[k]+' DAMAGED',3);if(k==='S'&&Math.random()<.5){S.shield=false}if(k==='E'&&S.speed>5)S.speed=5}}}
function galaxyStep(){const bases=S.sec.filter(s=>s.base);if(!bases.length)return;
 for(const s of S.sec.filter(s=>s.e>0&&s!==S.cur)){ // groups advance toward nearest base
  if(Math.random()<.4)continue;let b=bases.reduce((a,c)=>Math.hypot(c.x-s.x,c.y-s.y)<Math.hypot(a.x-s.x,a.y-s.y)?c:a);
  const nb=[[1,0],[-1,0],[0,1],[0,-1]].map(([dx,dy])=>[b.x+dx,b.y+dy]).filter(([x,y])=>x>=0&&y>=0&&x<GW&&y<GH);
  let tgt=nb.map(([x,y])=>sector(x,y)).filter(t=>t.e===0&&!t.base&&t!==S.cur).sort((p,q)=>Math.hypot(p.x-s.x,p.y-s.y)-Math.hypot(q.x-s.x,q.y-s.y))[0];
  if(!tgt||nb.some(([x,y])=>x===s.x&&y===s.y))continue;
  const dx=Math.sign(tgt.x-s.x),dy=Math.sign(tgt.y-s.y);const n=Math.abs(tgt.x-s.x)>=Math.abs(tgt.y-s.y)?sector(s.x+dx,s.y):sector(s.x,s.y+dy);
  if(n.base||n===S.cur||n.e+s.e>4)continue;n.e+=s.e;n.types=(n.types||[]).concat(s.types||[]);s.e=0;s.types=[]}
 for(const b of bases){const nb=[[1,0],[-1,0],[0,1],[0,-1]].map(([dx,dy])=>[b.x+dx,b.y+dy]).filter(([x,y])=>x>=0&&y>=0&&x<GW&&y<GH).map(([x,y])=>sector(x,y));
  const occ=nb.filter(n=>n.e>0).length;if(occ>=Math.min(nb.length,4)-(diff<2?0:1)&&occ>=2&&b!==S.cur){b.base=false;S.basesLost++;sfx.alert();say('STARBASE DESTROYED AT SECTOR '+(b.x+1)+','+(b.y+1),4);
   // attackers spill in
