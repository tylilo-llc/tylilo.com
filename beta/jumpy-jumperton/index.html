<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Jumpy Jumperton v1.4</title><style>
html,body{margin:0;height:100%;background:#0b0e1f;overflow:hidden;font-family:system-ui,sans-serif;color:#fff;touch-action:none;user-select:none}
#wrap{position:relative;height:100%;display:flex;align-items:center;justify-content:center}
canvas{background:linear-gradient(#141a3a,#2a1a4a);box-shadow:0 0 40px #6af5;border-radius:8px;max-height:100%;max-width:100%}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:#0009}
#ov h1{font-size:44px;margin:0;color:#ffd84a;text-shadow:0 4px 0 #c55}#ov p{opacity:.9}
button.big{font-size:22px;padding:12px 30px;border:0;border-radius:30px;background:#ffd84a;color:#222;font-weight:bold;cursor:pointer}
#touch{position:absolute;bottom:10px;left:0;right:0;display:none;justify-content:space-between;padding:0 14px;pointer-events:none}
#touch div{pointer-events:auto;width:70px;height:70px;border-radius:50%;background:#fff3;display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 6px}
button.cb{font-size:16px;padding:8px 16px;margin:0 4px;border:2px solid #ffd84a;border-radius:20px;background:none;color:#ffd84a}button.cb.on{background:#ffd84a;color:#222}body{--strip:0px}
body.tb{--strip:calc(120px + env(safe-area-inset-bottom))}
body.ts{--strip:calc(120px + env(safe-area-inset-bottom))}
#wrap{box-sizing:border-box;height:100vh;height:100dvh;padding-bottom:var(--strip);padding-top:env(safe-area-inset-top)}
canvas{max-height:calc(100vh - var(--strip) - env(safe-area-inset-top));max-height:calc(100dvh - var(--strip) - env(safe-area-inset-top))}
body.ts #touch span{visibility:hidden}body.ts #tj{width:84px;height:84px}
body.tb #touch,body.ts #touch{position:fixed;bottom:env(safe-area-inset-bottom);height:120px;align-items:center;padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right));background:#0006}
</style></head><body><div id="wrap"><canvas id="c" width="420" height="700"></canvas>
<div id="ov"><h1>JUMPY<br>JUMPERTON</h1><div style="opacity:.7;margin-top:4px">v1.4</div><p>Jump onto falling blocks for points!<br>Higher blocks = bigger bonus. Don't fall off the bottom<br>and don't get squashed.<br>⚡ Grab boosters for 20s of double jump!</p><p>←/→ or A/D to move · Space/↑/W to jump</p><p id="hs"></p><div id="ctl" style="display:none;margin:0 0 14px">Controls: <button class="cb" data-m="buttons">Buttons</button><button class="cb" data-m="swipe">Swipe</button><div id="ctlh" style="font-size:13px;opacity:.75;margin-top:6px"></div></div><button class="big" id="go">PLAY</button></div>
<div id="touch"><span id="arrows" style="display:flex"><div id="tl">◀</div><div id="tr">▶</div></span><div id="tj">⤒</div></div></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=420,H=700,C=30,COLS=14;
const SH={I:[[0,0],[1,0],[2,0],[3,0]],O:[[0,0],[1,0],[0,1],[1,1]],T:[[0,0],[1,0],[2,0],[1,1]],L:[[0,0],[0,1],[0,2],[1,2]],J:[[1,0],[1,1],[1,2],[0,2]],S:[[1,0],[2,0],[0,1],[1,1]],Z:[[0,0],[1,0],[1,1],[2,1]]};
const COL={I:'#3ee0f0',O:'#ffd84a',T:'#b86bff',L:'#ff9a3c',J:'#4a7bff',S:'#4ae07a',Z:'#ff4a6a'};
const JV=560,GR=1500,VMAX=260;
const MAXH=JV*JV/(2*GR); // ~104px peak with jump held
const CLIMB=Math.floor((MAXH-26*0.15)/C); // rows climbable (3)
let boosts=[],djT=0,djUsed=false;
function heights(){const h=new Array(COLS).fill(0);for(const k of grid.keys()){const[c,r]=k.split(',').map(Number);if(c>=0&&c<COLS)h[c]=Math.max(h[c],r+1);}return h;}
function dropOn(h,cells,col){const bot={};for(const[cx,cy]of cells)bot[cx]=Math.max(bot[cx]??-1,cy);
 const maxCy=Math.max(...cells.map(c=>c[1]));let base=0;for(const cx in bot){base=Math.max(base,h[col+ +cx]-(maxCy-bot[cx]));}
 const n=h.slice();for(const[cx,cy]of cells)n[col+cx]=Math.max(n[col+cx],base+(maxCy-cy)+1);return n;}
function reach(h,pc,ph){const seen=new Set();const q=[];const start=Math.max(0,Math.min(COLS-1,pc));
 for(let c=0;c<COLS;c++)if(Math.abs(c-start)<=1&&h[c]-ph<=CLIMB){seen.add(c);q.push(c);}
 while(q.length){const c=q.shift();for(const n of[c-1,c+1])if(n>=0&&n<COLS&&!seen.has(n)&&h[n]-h[c]<=CLIMB){seen.add(n);q.push(n);}}
 return seen;}
function playerSpot(){return[Math.floor((P.x+P.w/2)/C),Math.max(0,Math.round(-(P.y+P.h)/C))];}
function projected(){let h=heights();for(const f of falling)h=dropOn(h,f.cells,f.col);return h;}
function reachTop(){const h=heights(),[pc,ph]=playerSpot(),s=reach(h,pc,ph);let m=ph;for(const c of s)m=Math.max(m,h[c]);return m;}
let st='menu',grid,falling,P,camY,t,score,hi=+localStorage.jjHi||0,spawnT,parts,keys={},pid,best;
const ov=document.getElementById('ov');document.getElementById('hs').textContent=hi?'High score: '+hi:'';
const key=(c,r)=>c+','+r;
function rot(cells,n){for(let i=0;i<n;i++)cells=cells.map(([x,y])=>[-y,x]);const mx=Math.min(...cells.map(c=>c[0])),my=Math.min(...cells.map(c=>c[1]));return cells.map(([x,y])=>[x-mx,y-my]);}
function reset(){boosts=[];djT=0;djUsed=false;grid=new Map();falling=[];parts=[];t=0;score=0;spawnT=0;pid=0;camY=-H+C*2;best=0;
 P={x:W/2-10,y:-40,w:20,h:26,vx:0,vy:0,g:false,face:1,on:null,sq:1};}
function diff(){return Math.min(1,t/180);}
function spawn(){const ks=Object.keys(SH),k=ks[Math.random()*7|0];
 const h=projected(),[pc,ph]=playerSpot();const ok=[],any=[];
 for(let r=0;r<4;r++){const cells=rot(SH[k],r),w=Math.max(...cells.map(c=>c[0]))+1;for(let col=0;col+w<=COLS;col++){const n=dropOn(h,cells,col);
  const s=reach(n,pc,ph);let top=0,newTop=0;for(const c of s)top=Math.max(top,n[c]);for(let i=0;i<w;i++)newTop=Math.max(newTop,n[col+i]);
  const o={cells,col};any.push(o);if(top>=Math.max(...n)&&cells.some(([cx])=>s.has(col+cx)&&n[col+cx]===newTop))ok.push(o);}}
 const L=ok.length?ok:any,pick=L[Math.random()*L.length|0];const cells=pick.cells,col=pick.col;
 if(Math.random()<.12+diff()*.05)boosts.push({x:(Math.random()*(COLS-1)|0)*C+C/2,y:camY-C*3,v:70,landed:false});falling.push({k,cells,col,y:camY-C*4,id:++pid,v:60+diff()*160+Math.random()*30,scored:false});}
function solidAt(x,y,w,h,skip){// returns list of rects overlapping
 const out=[];const c0=Math.floor(x/C),c1=Math.floor((x+w-.01)/C),r0=Math.floor(-(y+h-.01)/C),r1=Math.floor(-y/C);
 for(let c=c0;c<=c1;c++)for(let r=r0;r<=r1+1;r++){const g=grid.get(key(c,r));if(g){const ry=-(r+1)*C;if(ry<y+h&&ry+C>y)out.push({x:c*C,y:ry,w:C,h:C,id:g.id,f:null});}}
 if(y+h>0)out.push({x:-1e4,y:0,w:2e4,h:C*50,id:0});
 if(x<0)out.push({x:-C*10,y:-1e6,w:C*10,h:2e6,id:-1});if(x+w>W)out.push({x:W,y:-1e6,w:C*10,h:2e6,id:-1});
 for(const f of falling)if(f!==skip)for(const[cx,cy]of f.cells){const rx=(f.col+cx)*C,ry=f.y+cy*C;if(rx<x+w&&rx+C>x&&ry<y+h&&ry+C>y)out.push({x:rx,y:ry,w:C,h:C,id:f.id,f});}
 return out;}
function pieceLand(f){// can it move down by dy?
 for(const[cx,cy]of f.cells){const bot=f.y+(cy+1)*C;if(bot>=0)return 0;const r=Math.floor(-bot/C);if(grid.has(key(f.col+cx,r)))return -(r)*C-C*(cy+1)-f.y+0;}return null;}
function maxDrop(f,dy){let m=dy;for(const[cx,cy]of f.cells){const bot=f.y+(cy+1)*C;let lim=-bot;// floor
  for(let r=0;r<400;r++){if(grid.has(key(f.col+cx,r))){const top=-(r+1)*C;if(top>=bot-0.01){lim=Math.min(lim,top-bot);}}}
  m=Math.min(m,lim);}return Math.max(0,m);}
function burst(x,y,c,n){for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*300,vy:-Math.random()*300,l:.6+Math.random()*.4,c});}
function over(){st='over';if(score>hi){hi=score;localStorage.jjHi=hi;}burst(P.x+10,P.y+13,'#fff',40);
 setTimeout(()=>{ov.style.display='flex';ov.querySelector('h1').innerHTML='GAME<br>OVER';ov.querySelector('p').innerHTML='Score: <b>'+score+'</b>';document.getElementById('hs').textContent='High score: '+hi;document.getElementById('go').textContent='PLAY AGAIN';},700);}
function hit(r){return r.x<P.x+P.w&&r.x+r.w>P.x&&r.y<P.y+P.h&&r.y+r.h>P.y;}
function update(dt){t+=dt;const d=diff();
 spawnT-=dt;if(spawnT<=0){spawn();spawnT=2.2-d*1.5+Math.random()*.5;}
 // falling pieces
 for(const f of [...falling]){const dy=maxDrop(f,f.v*dt);const ridden=P.on===f;f.y+=dy;
  if(ridden)P.y+=dy;
  else for(const[cx,cy]of f.cells){const r={x:(f.col+cx)*C,y:f.y+cy*C,w:C,h:C};if(hit(r)){const push=r.y+C-P.y;P.y+=push;if(solidAt(P.x+2,P.y,P.w-4,P.h,f).some(s=>!s.f)){P.y-=push;P.sq=.3;return over();}}}
  if(dy<f.v*dt-0.001){falling.splice(falling.indexOf(f),1);f.y=Math.round(f.y/C)*C;for(const[cx,cy]of f.cells){const r=Math.round(-(f.y+(cy+1)*C)/C);grid.set(key(f.col+cx,r),{k:f.k,id:f.id,scored:f.scored});}
   if(ridden)P.on=null;burst((f.col+1)*C,f.y+C*2,COL[f.k],8);}}
 // player
 const ax=(keys.l?-1:0)+(keys.r?1:0);if(ax)P.face=ax;P.vx+=(ax*900-P.vx*(P.g?10:3))*dt;P.vx=Math.max(-260,Math.min(260,P.vx));
 const jp=keys.jp;keys.jp=false;if(jp&&!P.g&&djT>0&&!djUsed){P.vy=-JV*.9;djUsed=true;P.sq=1.3;burst(P.x+10,P.y+P.h,'#6ff',14);}
 if((keys.j||jp)&&P.g){P.vy=-JV;P.g=false;P.on=null;P.sq=1.3;keys.jq=false;}
 if(!keys.j&&P.vy<-200)P.vy+=1600*dt;P.vy=Math.min(P.vy+GR*dt,900);if(P.g)djUsed=false;djT=Math.max(0,djT-dt);
 P.x+=P.vx*dt;for(const s of solidAt(P.x,P.y,P.w,P.h-1)){if(s.y+0.5>=P.y+P.h)continue;if(P.vx>0||s.x>P.x)P.x=s.x-P.w;else P.x=s.x+s.w;P.vx=0;}
 const wasG=P.g;P.g=false;P.y+=P.vy*dt;
 for(const s of solidAt(P.x+1,P.y,P.w-2,P.h)){if(P.vy>=0&&s.y>=P.y+P.h-P.vy*dt-2){P.y=s.y-P.h;P.vy=0;P.g=true;P.on=s.f;
   if(!wasG){P.sq=.7;land(s);}}else if(P.vy<0){P.y=s.y+s.h;P.vy=0;}}
 if(!P.g)P.on=null;P.sq+=(1-P.sq)*Math.min(1,dt*12);
 // boosters
 const bh=heights();for(const b of boosts){if(!b.landed){b.y+=b.v*dt;const fl=-bh[Math.floor(b.x/C)]*C-12;if(b.y>=fl){b.y=fl;b.landed=true;}}
  if(Math.abs(b.x-(P.x+P.w/2))<20&&Math.abs(b.y-(P.y+P.h/2))<24){b.got=true;djT=20;djUsed=false;floats.push({x:P.x,y:P.y,txt:'DOUBLE JUMP!',l:1.2});burst(b.x,b.y,'#6ff',20);}}
 boosts=boosts.filter(b=>!b.got&&b.y<camY+H+60);
 // camera
 const target=P.y-H*.4;const top=-reachTop()*C;const floorCam=Math.min(top,P.g?P.y+P.h:top)-H+C*1.5;if(t>5&&camY>floorCam)camY=Math.max(floorCam,camY-(12+d*45)*dt);if(target<camY)camY+=(target-camY)*Math.min(1,dt*4);
 if(P.y>camY+H)over();
 for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=900*dt;p.l-=dt;}parts=parts.filter(p=>p.l>0);
 // prune old rows
 if(Math.random()<.02){const lim=Math.floor(-(camY+H*2)/C);for(const k of grid.keys())if(+k.split(',')[1]<lim)grid.delete(k);}}
function land(s){if(s.id<=0)return;let p=s.f;let rec=p||[...grid.values()].find(g=>g.id===s.id);if(!rec||rec.scored)return;
 if(p)p.scored=true;for(const g of grid.values())if(g.id===s.id)g.scored=true;
 const h=Math.max(0,Math.floor(-(P.y+P.h)/C));const pts=10+h*2+(p?15:0);score+=pts;best=Math.max(best,h);
 floats.push({x:P.x,y:P.y,txt:'+'+pts+(p?' AIRBORNE!':''),l:1});burst(P.x+10,P.y+P.h,'#ffd84a',12);}
let floats=[];
function block(x,y,c,a){ctx.fillStyle=c;ctx.fillRect(x+1,y+1,C-2,C-2);ctx.fillStyle='#fff5';ctx.fillRect(x+1,y+1,C-2,5);ctx.fillStyle='#0004';ctx.fillRect(x+1,y+C-6,C-2,5);if(a){ctx.fillStyle='#fff3';ctx.fillRect(x+1,y+1,C-2,C-2);}}
function draw(){ctx.clearRect(0,0,W,H);ctx.save();ctx.translate(0,-Math.round(camY));
 ctx.fillStyle='#fff1';for(let i=0;i<40;i++){const sy=((i*137)%H)+Math.floor(camY/H)*H;ctx.fillRect((i*71)%W,sy,2,2);ctx.fillRect((i*71)%W,sy+H,2,2);}
 ctx.fillStyle='#3a2d5a';ctx.fillRect(0,0,W,H);
 for(const[k,g]of grid){const[c,r]=k.split(',').map(Number);block(c*C,-(r+1)*C,COL[g.k],!g.scored);}
 for(const f of falling)for(const[cx,cy]of f.cells)block((f.col+cx)*C,f.y+cy*C,COL[f.k],!f.scored);
 for(const f of falling){if(f.y<camY-C){ctx.fillStyle=COL[f.k];ctx.globalAlpha=.6+.4*Math.sin(t*10);ctx.beginPath();const x=(f.col+1)*C;ctx.moveTo(x-8,camY+4);ctx.lineTo(x+8,camY+4);ctx.lineTo(x,camY+16);ctx.fill();ctx.globalAlpha=1;}}
 for(const b of boosts){const g=4*Math.sin(t*6);ctx.save();ctx.shadowColor='#6ff';ctx.shadowBlur=15;ctx.fillStyle='#6ff';ctx.beginPath();ctx.arc(b.x,b.y+g,11,0,7);ctx.fill();ctx.fillStyle='#035';ctx.font='bold 14px system-ui';ctx.textAlign='center';ctx.fillText('⚡',b.x,b.y+g+5);ctx.restore();}
 if(djT>0){ctx.save();ctx.shadowColor='#6ff';ctx.shadowBlur=20+8*Math.sin(t*10);ctx.strokeStyle=djT<3&&t%.3<.15?'#fff':'#6ff';ctx.lineWidth=3;ctx.beginPath();ctx.roundRect(P.x-3,P.y-3,P.w+6,P.h+6,9);ctx.stroke();ctx.restore();}
 if(st!=='over'||t%0.2<0.1){const sx=1/P.sq**.5,sy=P.sq;ctx.save();ctx.translate(P.x+P.w/2,P.y+P.h);ctx.scale(sx,sy);
  ctx.fillStyle='#ff6fa8';ctx.beginPath();ctx.roundRect(-P.w/2,-P.h,P.w,P.h,7);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(P.face*3-4,-P.h+6,6,7);ctx.fillStyle='#222';ctx.fillRect(P.face*3-2+P.face,-P.h+8,3,4);ctx.restore();}
 for(const p of parts){ctx.globalAlpha=Math.max(0,p.l);ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,4,4);}ctx.globalAlpha=1;
 ctx.font='bold 16px system-ui';ctx.textAlign='center';for(const f of floats){ctx.globalAlpha=f.l;ctx.fillStyle='#ffd84a';ctx.fillText(f.txt,f.x+10,f.y-10-(1-f.l)*40);}ctx.globalAlpha=1;
 ctx.restore();ctx.fillStyle='#f44a';ctx.fillRect(0,H-4,W,4);
 ctx.fillStyle='#fff';ctx.font='bold 22px system-ui';ctx.textAlign='left';ctx.fillText('Score '+score,12,30);ctx.textAlign='right';ctx.font='14px system-ui';if(djT>0){ctx.fillStyle='#6ff';ctx.font='bold 16px system-ui';ctx.fillText('⚡ Double jump '+Math.ceil(djT)+'s',W-12,52);ctx.fillStyle='#fff';ctx.font='14px system-ui';}ctx.fillText('Best '+hi+'  ·  Lvl '+(1+Math.floor(diff()*9)),W-12,28);}
let last=0;function loop(ts){const dt=Math.min(.033,(ts-last)/1000||0);last=ts;if(st==='play')update(dt);else if(st==='over'){for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=900*dt;p.l-=dt;}t+=dt;}
 for(const f of floats)f.l-=dt;floats=floats.filter(f=>f.l>0);if(grid)draw();requestAnimationFrame(loop);}
function start(){reset();floats=[];st='play';ov.style.display='none';}
document.getElementById('go').onclick=start;
const map={ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r',ArrowUp:'j',KeyW:'j',Space:'j'};
addEventListener('keydown',e=>{if(map[e.code]){if(map[e.code]==='j'&&!e.repeat&&!keys.j)keys.jp=true;keys[map[e.code]]=true;e.preventDefault();}if((e.code==='Enter'||e.code==='Space')&&st!=='play'&&ov.style.display!=='none')start();});
addEventListener('keyup',e=>{if(map[e.code])keys[map[e.code]]=false;});
const isTouch='ontouchstart'in window||navigator.maxTouchPoints>0;let ctlMode=localStorage.jjCtl||'buttons';
function setCtl(m){ctlMode=m;localStorage.jjCtl=m;document.querySelectorAll('.cb').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
 document.getElementById('touch').style.display=isTouch?'flex':'none';document.body.classList.toggle('tb',isTouch&&m==='buttons');document.body.classList.toggle('ts',isTouch&&m==='swipe');
 document.getElementById('ctlh').textContent=m==='swipe'?'Drag & hold left/right anywhere to run · jump button bottom-right (hold = higher, tap again in air with ⚡)':'On-screen ◀ ▶ and jump buttons';}
if(isTouch){document.getElementById('ctl').style.display='block';}
document.querySelectorAll('.cb').forEach(b=>{b.onclick=e=>{e.stopPropagation();setCtl(b.dataset.m);};b.addEventListener('touchstart',e=>e.stopPropagation());});
setCtl(ctlMode);
let sw=null;
addEventListener('touchstart',e=>{if(ctlMode!=='swipe'||st!=='play')return;if(sw)return;const t0=[...e.changedTouches].find(t=>!t.target.closest||!t.target.closest('#touch div'));if(!t0)return;e.preventDefault();sw={id:t0.identifier,x:t0.clientX,y:t0.clientY,ax:t0.clientX,ay:t0.clientY,t:performance.now(),moved:false,jumped:false};},{passive:false});
addEventListener('touchmove',e=>{if(!sw)return;e.preventDefault();for(const t0 of e.changedTouches){if(t0.identifier!==sw.id)continue;
 const dx=t0.clientX-sw.ax,dy=t0.clientY-sw.ay;if(Math.hypot(t0.clientX-sw.x,t0.clientY-sw.y)>12)sw.moved=true;
 if(dx>18){keys.r=true;keys.l=false;sw.ax=t0.clientX-18;}else if(dx<-18){keys.l=true;keys.r=false;sw.ax=t0.clientX+18;}}},{passive:false});
function swEnd(e){if(!sw)return;for(const t0 of e.changedTouches){if(t0.identifier!==sw.id)continue;
keys.l=keys.r=false;sw=null;}}
addEventListener('touchend',swEnd);addEventListener('touchcancel',swEnd);

for(const[id,k]of[['tl','l'],['tr','r'],['tj','j']]){const el=document.getElementById(id);el.addEventListener('touchstart',e=>{e.preventDefault();e.stopPropagation();if(k==='j')keys.jp=true;keys[k]=true;});el.addEventListener('touchend',e=>{e.preventDefault();keys[k]=false;});}
reset();requestAnimationFrame(loop);
</script></body></html>
