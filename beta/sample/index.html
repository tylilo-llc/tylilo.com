<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow">
  <title>Sample Beta</title>
  <style>
    body { margin: 4.5rem 1.5rem 2rem; background: #0A3161; color: #FFF6EA; font-family: sans-serif; }
    button { min-height: 2.75rem; padding: 0.5rem 1rem; font: inherit; font-weight: 800; }
  </style>
</head>
<body>
  <h1>Sample Beta</h1>
  <p>Version 0.1.0. This build is only for signed-in testing.</p>
  <p id="status">Checking the leaderboard.</p>
  <button type="button" id="play">Play a round</button>
  <script>
    document.getElementById("play").addEventListener("click", function () {
      document.getElementById("status").textContent = "Round finished. Score 12.";
    });
    fetch("/api/scores.php?game=sample&board=default").then(function () {
      document.getElementById("status").textContent = "The leaderboard answered. This build should not do that.";
    }).catch(function () {
      document.getElementById("status").textContent = "The leaderboard is unreachable, so this score stays on this page.";
    });
  </script>
</body>
</html>
